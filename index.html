    function formatBytes(bytes) {
      if (!Number.isFinite(bytes) || bytes <= 0) return "0 MB";
      const units = ["B", "KB", "MB", "GB"];
      const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      return `${(bytes / 1024 ** index).toFixed(index > 1 ? 1 : 0)} ${units[index]}`;
    }

    function isInstalledApp() {
      return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    }

    function workerCommand(type, payload = {}, onProgress) {
      if (!serviceWorkersAvailable) {
        return Promise.reject(new Error("Offline mode requires HTTPS and a browser with service-worker support."));
      }
      return navigator.serviceWorker.ready.then((registration) => {
        const worker = registration.active || navigator.serviceWorker.controller;
        if (!worker) throw new Error("No active service worker");
        return new Promise((resolve, reject) => {
          const channel = new MessageChannel();
          const timeout = setTimeout(() => reject(new Error("The service worker did not respond. Reload once while online.")), 15000);
          channel.port1.onmessage = (event) => {
            clearTimeout(timeout);
            const message = event.data;
            if (message.type === "progress") {
              onProgress?.(message);
            } else if (message.type === "complete") {
              resolve(message);
            } else if (message.type === "error") {
              reject(new Error(message.message));
            }
          };
          worker.postMessage({ type, ...payload }, [channel.port2]);
        });
      });
    }

    const mediaPackageCache = new Map();
    const coreImageNames = new Set([
      "957b81be-9dee-42ca-9fb9-a057a90071b1.png",
      "69726d3a-7238-4ea3-8200-2e7505b3b174.png",
      "6fb27a6f-cf86-4ee7-acc3-3b8365063ac9.jpg"
    ]);

    function collectImageNames(value, names) {
      if (typeof value === "string") {
        if (!value.includes("://") && /\.(png|jpe?g|webp)$/i.test(value)) names.add(value);
      } else if (Array.isArray(value)) {
        for (const item of value) collectImageNames(item, names);
      } else if (value && typeof value === "object") {
        for (const item of Object.values(value)) collectImageNames(item, names);
      }
    }

    function mediaUrlsFor(packageName) {
      if (mediaPackageCache.has(packageName)) return mediaPackageCache.get(packageName);
      const names = new Set();
      if (packageName === "festival") {
        const entities = new Map(state.data.entities.map((item) => [item.id, item]));
        const pois = new Map(state.data.poi.map((item) => [item.id, item]));
        for (const session of state.data.entitySessions) {
          if (!state.favorites.has(session.id)) continue;
          collectImageNames(entities.get(session.entityId)?.image, names);
          collectImageNames(pois.get(session.location)?.image, names);
        }
      } else if (packageName === "places") {
        collectImageNames(state.data.config?.app?.images?.mapImage, names);
        collectImageNames(state.data.poi, names);
      } else if (packageName === "info") {
        collectImageNames(state.data.posts, names);
        collectImageNames(state.data.merchandise, names);
        collectImageNames(state.data.partners, names);
      } else if (packageName === "all") {
        collectImageNames(state.data, names);
      }
      const urls = [...names]
        .filter((name) => !coreImageNames.has(name))
        .map((name) => imgPath(name));
      mediaPackageCache.set(packageName, urls);
      return urls;
    }

    async function refreshOfflineSettings(message = "") {
      const settings = state.offlineSettings;
      const refreshId = ++offlineRefreshId;
      settings.loading = true;
      settings.message = message || "Checking offline storage…";
      if (state.tab === "settings") renderSettings();
      try {
        if (!serviceWorkersAvailable) {
          const [storage, persistent] = await Promise.all([
            navigator.storage?.estimate?.() || {},
            navigator.storage?.persisted?.() || false
          ]);
          if (refreshId !== offlineRefreshId) return;
          settings.storage = storage;
          settings.persistent = persistent;
          settings.loaded = true;
          settings.message = window.isSecureContext
            ? "Service workers are unavailable here. Open the site in Chrome rather than an in-app browser."
            : "Offline mode requires HTTPS. An HTTP address on your local network cannot use service workers.";
          return;
        }
        const registration = await navigator.serviceWorker.getRegistration();
        if (!registration?.active) throw new Error("The service worker is not active yet. Reload once while online.");
        const [workerResult, storage, persistent] = await Promise.all([
          workerCommand("GET_OFFLINE_STATUS"),
          navigator.storage?.estimate?.() || {},
          navigator.storage?.persisted?.() || false
        ]);
        if (refreshId !== offlineRefreshId) return;
        settings.status = {
          ...workerResult.status,
          controlled: Boolean(navigator.serviceWorker.controller)
        };
        settings.storage = storage;
        settings.persistent = persistent;
        settings.loaded = true;
        settings.message = message;
      } catch (error) {
        if (refreshId !== offlineRefreshId) return;
        settings.message = error.message;
      } finally {
        if (refreshId !== offlineRefreshId) return;
        settings.loading = false;
        settings.progress = null;
        if (state.tab === "settings") renderSettings();
      }
    }

    function updateSettingsProgress(progress, label) {
      state.offlineSettings.progress = progress;
      state.offlineSettings.message = label;
      if (state.tab === "settings") renderSettings();
    }

    async function handleOfflineAction(action) {
      const settings = state.offlineSettings;
      if (settings.loading) return;
      settings.loading = true;
      settings.message = "";
      renderSettings();
      try {
        if (action === "install") {
          if (isInstalledApp()) {
            settings.message = "The app is already installed.";
          } else if (installPromptEvent) {
            await installPromptEvent.prompt();
            const choice = await installPromptEvent.userChoice;
            installPromptEvent = null;
            settings.message = choice.outcome === "accepted"
              ? "Installation started."
              : "Installation cancelled.";
          } else if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
            settings.message = "In Safari, tap Share and then “Add to Home Screen”.";
          } else {
            settings.message = "Use your browser menu and choose “Install app” or “Add to Home screen”.";
          }
        } else if (action === "persist") {
          const granted = await navigator.storage?.persist?.();
          settings.message = granted
            ? "Persistent storage granted."
            : "The browser did not grant persistent storage.";
        } else if (action === "repair") {
          if (!navigator.onLine) throw new Error("Go online before repairing the core files.");
          await workerCommand("REPAIR_CORE", {}, (progress) => {
            updateSettingsProgress(progress, `Repairing core files ${progress.completed}/${progress.total}…`);
          });
          settings.message = "Core offline files repaired.";
        } else if (action === "clear-media") {
          if (!confirm("Remove all optionally downloaded and previously viewed images?")) return;
          await workerCommand("CLEAR_MEDIA");
          settings.message = "Downloaded media cleared.";
        } else if (action.startsWith("download-")) {
          if (!navigator.onLine) throw new Error("Go online before downloading media.");
          const packageName = action.replace("download-", "");
          const urls = mediaUrlsFor(packageName);
          if (packageName === "all" && !confirm(`Download up to ${urls.length} images? This may use about 94 MB.`)) return;
          const response = await workerCommand("CACHE_MEDIA", { urls }, (progress) => {
            updateSettingsProgress(progress, `Downloading images ${progress.completed}/${progress.total}…`);
          });
          settings.message = response.result.failed
            ? `Finished with ${response.result.failed} failed image(s).`
            : `Offline images ready (${response.result.downloaded} newly downloaded).`;
        }
      } catch (error) {
        settings.message = error.message;
      } finally {
        settings.loading = false;
        settings.progress = null;
        await refreshOfflineSettings(settings.message);
      }
    }

    function renderSettings() {
      const settings = state.offlineSettings;
      const status = settings.status;
      const progress = settings.progress;
      const progressPercent = progress?.total ? Math.round(progress.completed / progress.total * 100) : 0;
      const storageUsed = settings.storage?.usage || 0;
      const storageQuota = settings.storage?.quota || 0;
      const festivalCount = mediaUrlsFor("festival").length;
      const placesCount = mediaUrlsFor("places").length;
      const infoCount = mediaUrlsFor("info").length;
      const allCount = mediaUrlsFor("all").length;
      const offlineAvailable = serviceWorkersAvailable;
      const installed = isInstalledApp();
      $("settingsView").innerHTML = `
        <div class="section-head">
          <div><h2>Settings</h2><p>Inspect, repair and expand what is available offline.</p></div>
        </div>
        ${progress ? `<div class="progress-track" aria-label="${progressPercent}% complete"><span style="--progress:${progressPercent}%"></span></div>` : ""}
        <p class="settings-message">${settings.message || ""}</p>
        <div class="settings-grid">
          <section class="setting-card">
            <h3>Install app</h3>
            <div class="metric">${installed ? "Installed" : "Use as an app"}</div>
            <p>Install Shambala on your home screen for a standalone window and easier offline access.</p>
            <div class="setting-actions">
              <button class="action-btn" data-offline-action="install" ${settings.loading || installed ? "disabled" : ""}>${installed ? "Already installed" : "Install app"}</button>
            </div>
          </section>
          <section class="setting-card">
            <h3>Offline core</h3>
            <div class="metric">${!offlineAvailable ? "Unavailable" : status ? `${status.coreCached}/${status.coreExpected} files` : "Checking…"}</div>
            <p>App v${APP_VERSION} · cache ${status?.cacheVersion || "—"} · data ${state.data.source?.deltaVersion || "bundled"}. Includes the interface, timetable, map and map renderer.</p>
            <div class="setting-actions">
              <button class="action-btn" data-offline-action="repair" ${settings.loading || !navigator.onLine || !offlineAvailable ? "disabled" : ""}>Repair core files</button>
            </div>
          </section>
          <section class="setting-card">
            <h3>Downloaded media</h3>
            <div class="metric">${status?.media.entries || 0} images · ${formatBytes(status?.media.bytes || 0)}</div>
            <p>Images are also saved automatically as you view them.</p>
            <div class="setting-actions">
              <button class="action-btn" data-offline-action="download-festival" ${settings.loading || !festivalCount || !offlineAvailable ? "disabled" : ""}>My Festival (${festivalCount})</button>
              <button class="action-btn" data-offline-action="download-places" ${settings.loading || !offlineAvailable ? "disabled" : ""}>Map & places (${placesCount})</button>
              <button class="action-btn" data-offline-action="download-info" ${settings.loading || !offlineAvailable ? "disabled" : ""}>Info (${infoCount})</button>
              <button class="action-btn" data-offline-action="download-all" ${settings.loading || !offlineAvailable ? "disabled" : ""}>All media (${allCount})</button>
              <button class="action-btn danger" data-offline-action="clear-media" ${settings.loading || !offlineAvailable ? "disabled" : ""}>Clear media</button>
            </div>
          </section>
          <section class="setting-card">
            <h3>Browser storage</h3>
            <div class="metric">${formatBytes(storageUsed)} used</div>
            <p>${storageQuota ? `${formatBytes(storageQuota)} available to this site. ` : ""}${settings.persistent ? "Persistent storage is enabled." : "Storage may be removed automatically when space is low."}</p>
            <div class="setting-actions">
              <button class="action-btn" data-offline-action="persist" ${settings.loading || settings.persistent ? "disabled" : ""}>Request persistent storage</button>
            </div>
          </section>
          <section class="setting-card">
            <h3>Service worker</h3>
            <div class="metric">${!offlineAvailable ? "Unavailable" : status?.controlled ? "Active" : "Not controlling this page"}</div>
            <p>${navigator.onLine ? "Online" : "Offline"} · ${window.isSecureContext ? "Secure connection" : "Insecure connection"} · ${status?.coreCache || "No cache detected"}</p>
          </section>
        </div>
      `;
    }

    function matches(ev, state, now = appNow()) {
      const timing = temporalState(ev.session, now);
      if (state.timetableView === "now") {
        const startsWithinWindow = Date.parse(ev.session.start) <= now + 2 * 60 * 60 * 1000;
        if (!startsWithinWindow || !["live", "upcoming"].includes(timing)) return false;
      } else if (ev.session.timeMarker !== state.day) {
        return false;
      }
      if (state.timetableView === "planned" && !state.favorites.has(ev.session.id)) return false;
      if (state.timetableView !== "now" && state.hideFinished && timing === "past") return false;
      if (state.venue && ev.venue?.id !== state.venue) return false;
      if (state.category && !(ev.session.category || []).includes(state.category)) return false;
      if (!state.query) return true;
      const q = state.query.toLowerCase();
      const hay = [
        ev.entity?.name,
        ev.venue?.name,
        ev.entity?.description,
        ...ev.cats.map((c) => c.name),
        ...ev.subs.map((c) => c.name),
      ].join(" ").toLowerCase();
      return hay.includes(q);
    }

    function eventRow(ev, tz, fallback, { showVenue = false, now = appNow() } = {}) {
      const timing = temporalState(ev.session, now);
      const startsSoon = timing === "upcoming" && Date.parse(ev.session.start) <= now + 2 * 60 * 60 * 1000;
      const timingLabel = timing === "live"
        ? "On now"
        : timing === "past"
          ? "Finished"
          : startsSoon
            ? relativeStart(ev.session.start, now)
            : "";
      const categories = `${ev.cats.map((c) => c.name).join(" · ")}${ev.subs.length ? " · " + ev.subs.map((s) => s.name).join(", ") : ""}`;
      return `
        <div class="row ${timing}">
          <button class="row-main" data-id="${ev.session.id}" aria-label="View ${ev.entity.name}">
            <div class="when">
              ${fmtRange(ev.session.start, ev.session.end, tz)}
              ${timingLabel ? `<span class="time-state">${timingLabel}</span>` : ""}
            </div>
            <img src="${imgPath(ev.entity.image, fallback)}" alt="" loading="lazy" decoding="async">
            <div>
              <div class="name">${ev.entity.name}</div>
              <div class="meta">${showVenue ? `<span class="venue-name">${ev.venue.name}</span>${categories ? " · " : ""}` : ""}${categories}</div>
            </div>
          </button>
          ${starButton(ev)}
        </div>
      `;
    }

    function render() {
      const data = state.data;
      const app = data.config?.app || {};
      const tz = app.tz || "Europe/London";
      const indexes = buildIndexes(data);
      const fallback = app.images?.defaultImage;
      const events = data.entitySessions
        .map((s) => eventRecord(s, indexes))
        .filter((ev) => ev.entity && ev.venue);

      const tabs = { timetable: "Timetable", map: "Map", explore: "Explore", info: "Info", search: "Search", settings: "Settings" };
      $("primaryNav").innerHTML = Object.entries(tabs).map(([key, label]) =>
        `<button data-tab="${key}" class="${state.tab === key ? "active" : ""}" aria-current="${state.tab === key ? "page" : "false"}">${label}</button>`
      ).join("");
      $("viewToggle").innerHTML = `
        <button data-view="all" class="${state.timetableView === "all" ? "active" : ""}" aria-pressed="${state.timetableView === "all"}">Everything</button>
        <button data-view="planned" class="${state.timetableView === "planned" ? "active" : ""}" aria-pressed="${state.timetableView === "planned"}">
          My Festival (${state.favorites.size})
        </button>
        <button data-view="now" class="${state.timetableView === "now" ? "active" : ""}" aria-pressed="${state.timetableView === "now"}">Now & next</button>
      `;

      const timetableMode = state.tab === "timetable";
      $("controls").hidden = !timetableMode;
      $("mapView").hidden = state.tab !== "map";
      $("exploreView").hidden = state.tab !== "explore";
      $("infoView").hidden = state.tab !== "info";
      $("searchView").hidden = state.tab !== "search";
      $("settingsView").hidden = state.tab !== "settings";
      $("status").hidden = !timetableMode;
      $("list").hidden = !timetableMode;

      if (state.tab === "map") {
        closeDrawer();
        requestAnimationFrame(() => initMap(data));
        return;
      }
      if (state.tab === "explore") {
        renderExplore(indexes, fallback);
        const poi = data.poi.find((item) => item.id === state.selectedPoi);
        if (poi) openPoiDrawer(poi, indexes, fallback);
        else closeDrawer();
        return;
      }
      if (state.tab === "info") {
        renderInfo();
        const post = data.posts.find((item) => item.id === state.selectedPost);
        const merchandise = data.merchandise.find((item) => item.id === state.selectedMerch);
        const partner = data.partners.find((item) => item.id === state.selectedPartner);
        if (post) openPostDrawer(post);
        else if (merchandise) openMerchDrawer(merchandise);
        else if (partner) openPartnerDrawer(partner);
        else closeDrawer();
        return;
      }
      if (state.tab === "search") {
        closeDrawer();
        renderGlobalSearch(indexes, fallback);
        requestAnimationFrame(() => {
          const input = $("globalSearchInput");
          input?.focus();
          input?.setSelectionRange(input.value.length, input.value.length);
        });
        return;
      }
      if (state.tab === "settings") {
        closeDrawer();
        renderSettings();
        if (!state.offlineSettings.loaded && !state.offlineSettings.loading) refreshOfflineSettings();
        return;
      }

      const days = dayKeys(data);
      $("days").hidden = state.timetableView === "now";
      $("days").innerHTML = days.map((key) => {
        const label = fmtDay(key, tz);
        const count = events.filter((ev) =>
          ev.session.timeMarker === key && (state.timetableView === "all" || state.favorites.has(ev.session.id))
        ).length;
        return `<button data-day="${key}" class="${key === state.day ? "active" : ""}">
          ${label.weekday}<span class="sub">${label.short} · ${count}</span>
        </button>`;
      }).join("");

      const entityCats = data.categories
        .filter((c) => c.belongsTo === "entity")
        .sort((a, b) => b.tier - a.tier);
      $("cats").innerHTML = `<button class="chip ${state.category === "" ? "active" : ""}" data-cat="">All</button>` +
        entityCats.map((c) =>
          `<button class="chip ${state.category === c.id ? "active" : ""}" data-cat="${c.id}">${c.name}</button>`
        ).join("");

      const venues = [...new Map(events.map((ev) => [ev.venue.id, ev.venue])).values()]
        .sort((a, b) => a.name.localeCompare(b.name));
      $("venue").innerHTML = `<option value="">All venues</option>` +
        venues.map((v) => `<option value="${v.id}" ${v.id === state.venue ? "selected" : ""}>${v.name}</option>`).join("");

      $("hideFinished").hidden = state.timetableView === "now";
      $("hideFinished").classList.toggle("active", state.hideFinished);
      $("hideFinished").setAttribute("aria-pressed", String(state.hideFinished));
      $("hideFinished").textContent = state.hideFinished ? "Show finished" : "Hide finished";

      const now = appNow();
      const shown = events
        .filter((ev) => matches(ev, state, now))
        .sort((a, b) => a.session.start.localeCompare(b.session.start) || a.venue.name.localeCompare(b.venue.name));

      if (state.timetableView === "now") {
        const live = shown.filter((ev) => temporalState(ev.session, now) === "live");
        const upcoming = shown.filter((ev) => temporalState(ev.session, now) === "upcoming");
        $("status").textContent = `${live.length} on now · ${upcoming.length} starting in the next two hours`;
        $("list").innerHTML = [
          ["On now", live],
          ["Coming up", upcoming],
        ].filter(([, items]) => items.length).map(([label, items]) => `
          <section class="now-group">
            <h2>${label} · ${items.length}</h2>
            <div class="venue">${items.map((ev) => eventRow(ev, tz, fallback, { showVenue: true, now })).join("")}</div>
          </section>
        `).join("") || `<p class="status">Nothing is on now or starting in the next two hours.</p>`;
        openActDrawer(events.find((ev) => ev.session.id === state.selected), tz, fallback, events, indexes);
        return;
      }

      const groups = new Map();
      for (const ev of shown) {
        if (!groups.has(ev.venue.id)) groups.set(ev.venue.id, { venue: ev.venue, items: [] });
        groups.get(ev.venue.id).items.push(ev);
      }

      const dayStartHour = app.dayStartHour ?? 5;
      const dayStartLabel = `${dayStartHour % 12 || 12}:00 ${dayStartHour < 12 ? "am" : "pm"}`;
      $("status").textContent = `${shown.length} set${shown.length === 1 ? "" : "s"} · days start at ${dayStartLabel} ${tz.replace("_", " ")}`;
      $("list").innerHTML = [...groups.values()].map((group) => `
        <section class="venue">
          <button class="venue-title" data-collapse-venue="${group.venue.id}"
            aria-expanded="${!state.collapsedVenues.has(group.venue.id)}">
            <span>${group.venue.name}</span>
            <span class="venue-chevron" aria-hidden="true">${state.collapsedVenues.has(group.venue.id) ? "▶" : "▼"}</span>
          </button>
          ${state.collapsedVenues.has(group.venue.id) ? "" : group.items.map((ev) => eventRow(ev, tz, fallback, { now })).join("")}
        </section>
      `).join("") || `<p class="status">${
        state.timetableView === "planned" && state.favorites.size === 0
          ? "Your festival is empty. Switch to Everything and star some sets to start planning."
          : state.timetableView === "planned"
            ? "Nothing in your festival matches this day and these filters."
            : "Nothing matches these filters."
      }</p>`;

      openActDrawer(events.find((ev) => ev.session.id === state.selected), tz, fallback, events, indexes);
    }

    function openActDrawer(ev, tz, fallback, allEvents, indexes) {
      const drawer = $("drawer");
      const bg = $("drawerBg");
      if (!ev) {
        closeDrawer();
        return;
      }
      const others = allEvents
        .filter((item) => item.entity.id === ev.entity.id && item.session.id !== ev.session.id)
        .sort((a, b) => a.session.start.localeCompare(b.session.start));
      const warnings = [
        ev.session.epilepsyWarning ? "Epilepsy warning" : "",
        ev.session.explicitWarning ? "Explicit" : "",
        ev.session.isSpicy ? "Spicy" : "",
        ev.session.accessibilityInfo || ev.entity.accessibilityInfo || "",
      ].filter(Boolean);
      const links = (ev.entity.externalLinks || [])
        .map((link) => ({ ...link, safeUrl: safeExternalUrl(link?.url) }))
        .filter((link) => link.safeUrl);
      const videoId = youtubeId(ev.entity.youtubePreview);
      const recommendations = (ev.entity.linkedListEntities || [])
        .map((id) => indexes.entities[id])
        .filter(Boolean)
        .slice(0, 8);

      drawer.innerHTML = `
        <button class="close icon-btn" id="closeDrawer" aria-label="Close">×</button>
        <img class="hero" src="${imgPath(ev.entity.image, fallback)}" alt="">
        <div class="body">
          <div class="title-row">
            <h2>${ev.entity.name}</h2>
            ${starButton(ev)}
          </div>
          <div class="when">${ev.venue.name}<br>${fmtDay(ev.session.timeMarker, tz).weekday} ${fmtRange(ev.session.start, ev.session.end, tz)}</div>
          ${warnings.map((w) => `<span class="warn">${w}</span>`).join("")}
          <div class="link-list">
            ${shareButton(ev.entity.name)}
            ${poiCoordinates(ev.venue) ? `<button class="action-btn" data-show-map="${ev.venue.id}">Show venue on map</button>` : ""}
          </div>
          <p class="desc">${ev.session.description || ev.entity.description || ""}</p>
          ${videoId ? `<section class="drawer-section"><h3>Watch</h3><div class="video">
            <iframe src="https://www.youtube-nocookie.com/embed/${videoId}" title="${ev.entity.name} video" loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div></section>` : ""}
          ${links.length ? `<section class="drawer-section"><h3>Links</h3><div class="link-list">${
            links.map((link) => `<a href="${link.safeUrl}" target="_blank" rel="noreferrer">${link.text || link.type || "Website"}</a>`).join("")
          }</div></section>` : ""}
          ${ev.entity.quotes?.length ? `<section class="drawer-section"><h3>What people say</h3>${
            ev.entity.quotes.map((quote) => `<blockquote>${quote.description}${quote.credit ? `<footer>— ${quote.credit}</footer>` : ""}</blockquote>`).join("")
          }</section>` : ""}
          ${others.length ? `<div class="also"><strong>Other times</strong>${others.map((item) =>
            `<button data-id="${item.session.id}">${item.venue.name} · ${fmtDay(item.session.timeMarker, tz).weekday} ${fmtRange(item.session.start, item.session.end, tz)}</button>`
          ).join("")}</div>` : ""}
          ${recommendations.length ? `<section class="drawer-section"><h3>${ev.entity.linkedListTitle || "You might also like"}</h3>
            <div class="related-grid">${recommendations.map((entity) => {
              const relatedEvent = allEvents.find((item) => item.entity.id === entity.id && item.session.timeMarker === state.day)
                || allEvents.find((item) => item.entity.id === entity.id);
              const tag = relatedEvent ? "button" : "div";
              return `<${tag} class="related-card" ${relatedEvent ? `data-id="${relatedEvent.session.id}"` : ""}>
                <img src="${imgPath(entity.image, fallback)}" alt=""><span>${entity.name}</span>
              </${tag}>`;
            }).join("")}</div>
          </section>` : ""}
        </div>
      `;
      drawer.classList.add("open");
      bg.classList.add("open");
    }

    function openPoiDrawer(poi, indexes, fallback) {
      const drawer = $("drawer");
      const category = indexes.categories[poi.category];
      const image = typeof poi.image === "string" && poi.image ? imgPath(poi.image, fallback) : "";
      const links = (poi.externalLinks || [])
        .map((link) => ({ ...link, safeUrl: safeExternalUrl(link?.url) }))
        .filter((link) => link.safeUrl);
      drawer.innerHTML = `
        <button class="close icon-btn" id="closeDrawer" aria-label="Close">×</button>
        ${image ? `<img class="hero" src="${image}" alt="">` : ""}
        <div class="body">
          <div class="eyebrow">${category?.name || "Place"}</div>
          <h2>${poi.name}</h2>
          <div class="link-list">
            ${shareButton(poi.name)}
            ${poiCoordinates(poi) ? `<button class="action-btn" data-show-map="${poi.id}">Show on map</button>` : ""}
          </div>
          ${poi.description ? `<p class="desc">${poi.description}</p>` : ""}
          ${poi.w3wAddress ? `<p><strong>What3Words</strong><br>///${poi.w3wAddress}</p>` : ""}
          ${links.length ? `<section class="drawer-section"><h3>Links</h3><div class="link-list">${
            links.map((link) => `<a href="${link.safeUrl}" target="_blank" rel="noreferrer">${link.text || link.type || "Website"}</a>`).join("")
          }</div></section>` : ""}
        </div>
      `;
      drawer.classList.add("open");
      $("drawerBg").classList.add("open");
    }

    function openPostDrawer(post) {
      const drawer = $("drawer");
      const image = typeof post.image === "string" && post.image ? imgPath(post.image) : "";
      const link = safeExternalUrl(post.postLink?.value);
      drawer.innerHTML = `
        <button class="close icon-btn" id="closeDrawer" aria-label="Close">×</button>
        ${image ? `<img class="hero" src="${image}" alt="">` : ""}
        <div class="body">
          ${post.subtitle ? `<div class="eyebrow">${post.subtitle}</div>` : ""}
          <h2>${post.title}</h2>
          <div class="article-meta">${formatDate(post.publishedAt)}</div>
          <p>${shareButton(post.title)}</p>
          <div class="article-body">${sanitizeHtml(post.body)}</div>
          ${link ? `<p><a class="action-btn" href="${link}" target="_blank" rel="noreferrer">${post.postLink.title || "Read more"}</a></p>` : ""}
        </div>
      `;
      drawer.classList.add("open");
      $("drawerBg").classList.add("open");
    }

    function openMerchDrawer(item) {
      const drawer = $("drawer");
      const image = typeof item.image === "string" && item.image ? imgPath(item.image) : "";
      const url = safeExternalUrl(item.url);
      drawer.innerHTML = `
        <button class="close icon-btn" id="closeDrawer" aria-label="Close">×</button>
        ${image ? `<img class="hero" src="${image}" alt="">` : ""}
        <div class="body">
          <div class="eyebrow">${item.isFestivalMerch ? "Official merchandise" : "Merchandise"}</div>
          <h2>${item.name}</h2>
          ${item.subtitle ? `<p class="desc">${item.subtitle}</p>` : ""}
          <div class="link-list">
            ${shareButton(item.name)}
            ${url ? `<a href="${url}" target="_blank" rel="noreferrer">View in shop</a>` : ""}
          </div>
        </div>
      `;
      drawer.classList.add("open");
      $("drawerBg").classList.add("open");
    }

    function openPartnerDrawer(item) {
      const drawer = $("drawer");
      const image = typeof item.image === "string" && item.image ? imgPath(item.image) : "";
      const links = (item.externalLinks || [])
        .map((link) => ({ ...link, safeUrl: safeExternalUrl(link?.url) }))
        .filter((link) => link.safeUrl);
      drawer.innerHTML = `
        <button class="close icon-btn" id="closeDrawer" aria-label="Close">×</button>
        ${image ? `<img class="hero" src="${image}" alt="">` : ""}
        <div class="body">
          <div class="eyebrow">${item.cardPillText || "Partner"}</div>
          <h2>${item.name}</h2>
          ${item.description ? `<p class="desc">${item.description}</p>` : ""}
          <div class="link-list">
            ${shareButton(item.name)}
            ${links.map((link) => `<a href="${link.safeUrl}" target="_blank" rel="noreferrer">${link.text || link.type || "Website"}</a>`).join("")}
          </div>
        </div>
      `;
      drawer.classList.add("open");
      $("drawerBg").classList.add("open");
    }

    function bind() {
      $("primaryNav").addEventListener("click", (e) => {
        const button = e.target.closest("button[data-tab]");
        if (!button) return;
        navigateTab(button.dataset.tab);
      });
      $("viewToggle").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-view]");
        if (!btn) return;
        state.timetableView = btn.dataset.view;
        render();
      });
      $("mapLabelControls").addEventListener("click", (e) => {
        const button = e.target.closest("button[data-map-label]");
        if (!button) return;
        const label = button.dataset.mapLabel;
        state.mapLabels[label] = !state.mapLabels[label];
        updateMapLabelControls();
        saveMapPreferences();
      });
      $("days").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-day]");
        if (!btn) return;
        state.day = btn.dataset.day;
        render();
      });
      $("cats").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-cat]");
        if (!btn) return;
        state.category = btn.dataset.cat;
        render();
      });
      $("venue").addEventListener("change", (e) => {
        state.venue = e.target.value;
        render();
      });
      $("search").addEventListener("input", (e) => {
        state.query = e.target.value.trim();
        render();
      });
      $("hideFinished").addEventListener("click", () => {
        state.hideFinished = !state.hideFinished;
        saveTimetablePreferences();
        render();
      });
      $("exploreView").addEventListener("click", (e) => {
        const bucket = e.target.closest("button[data-explore]");
        if (bucket) {
          state.exploreBucket = bucket.dataset.explore;
          history.pushState({ tab: "explore" }, "", "#explore");
          applyRoute();
          return;
        }
        const mapButton = e.target.closest("button[data-show-map]");
        if (mapButton) {
          showPoiOnMap(mapButton.dataset.showMap);
          return;
        }
        const poiButton = e.target.closest("button[data-poi]");
        if (!poiButton) return;
        navigateToDetail("place", poiButton.dataset.poi);
      });
      $("infoView").addEventListener("click", (e) => {
        const tab = e.target.closest("button[data-info]");
        if (tab) {
          state.infoCategory = tab.dataset.info;
          history.pushState({ tab: "info" }, "", "#info");
          applyRoute();
          return;
        }
        const post = e.target.closest("button[data-post]");
        if (post) {
          navigateToDetail("post", post.dataset.post);
          return;
        }
        const merch = e.target.closest("button[data-merch]");
        if (merch) {
          navigateToDetail("merch", merch.dataset.merch);
          return;
        }
        const partner = e.target.closest("button[data-partner]");
        if (partner) navigateToDetail("partner", partner.dataset.partner);
      });
      $("searchView").addEventListener("input", (e) => {
        if (e.target.id !== "globalSearchInput") return;
        state.globalQuery = e.target.value;
        render();
      });
      $("searchView").addEventListener("click", (e) => {
        const result = e.target.closest("button[data-search-kind]");
        if (result) navigateToDetail(result.dataset.searchKind, result.dataset.searchId);
      });
      $("settingsView").addEventListener("click", (e) => {
        const button = e.target.closest("button[data-offline-action]");
        if (button) handleOfflineAction(button.dataset.offlineAction);
      });
      $("list").addEventListener("click", (e) => {
        const venueTitle = e.target.closest("button[data-collapse-venue]");
        if (venueTitle) {
          const id = venueTitle.dataset.collapseVenue;
          if (state.collapsedVenues.has(id)) state.collapsedVenues.delete(id);
          else state.collapsedVenues.add(id);
          render();
          return;
        }
        const favorite = e.target.closest("button[data-favorite]");
        if (favorite) {
          toggleFavorite(favorite.dataset.favorite);
          return;
        }
        const btn = e.target.closest("button[data-id]");
        if (!btn) return;
        navigateToDetail("act", btn.dataset.id);
      });
      $("drawer").addEventListener("click", (e) => {
        const share = e.target.closest("button[data-share-title]");
        if (share) {
          shareCurrentDetail(share);
          return;
        }
        const mapButton = e.target.closest("button[data-show-map]");
        if (mapButton) {
          showPoiOnMap(mapButton.dataset.showMap);
          return;
        }
        const favorite = e.target.closest("button[data-favorite]");
        if (favorite) {
          toggleFavorite(favorite.dataset.favorite);
          return;
        }
        if (e.target.id === "closeDrawer") {
          dismissDrawer();
          return;
        }
        const btn = e.target.closest("button[data-id]");
        if (!btn) return;
        navigateToDetail("act", btn.dataset.id);
      });
      $("drawerBg").addEventListener("click", () => {
        dismissDrawer();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && $("drawer").classList.contains("open")) dismissDrawer();
      });
      window.addEventListener("popstate", () => applyRoute());
    }

    async function init() {
      try {
        const res = await fetch(DATA_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        state.data = data;
        state.favorites = loadFavorites();
        state.mapLabels = loadMapPreferences();
        state.hideFinished = loadTimetablePreferences().hideFinished;
        updateMapLabelControls();
        const validSessionIds = new Set(data.entitySessions.map((session) => session.id));
        state.favorites = new Set([...state.favorites].filter((id) => validSessionIds.has(id)));
        saveFavorites();
        const app = data.config?.app || {};
        $("title").textContent = `${app.name || "Shambala"} festival guide`;
        updateSubtitle();
        const logo = imgPath(app.images?.logo);
        if (logo) {
          $("logo").src = logo;
          $("logo").hidden = false;
        }
        state.day = currentFestivalDay(data);
        $("controls").hidden = false;
        bind();
        if (!location.hash) {
          history.replaceState({ tab: "timetable" }, "", "#timetable");
        } else {
          history.replaceState({ detailEntry: false }, "", location.href);
        }
        applyRoute();
      } catch (err) {
        $("subtitle").textContent = "Could not load data/merged.json";
        $("status").innerHTML = `<div class="error">
          This page needs to be served over HTTP so it can read the JSON.<br>
          From the project folder run:<br>
          <code>python3 -m http.server 8000</code><br>
          then open <code>http://localhost:8000/timetable.html</code><br>
          <small>${err.message}</small>
        </div>`;
      }
    }

    function updateSubtitle() {
      const dataVersion = state.data?.source?.deltaVersion;
      const tz = state.data?.config?.app?.tz || "Europe/London";
      const testClock = TEST_TIME === null
        ? TEST_TIME_RAW ? " · Invalid test time" : ""
        : ` · Test clock ${new Intl.DateTimeFormat("en-GB", {
          weekday: "short",
          day: "numeric",
          month: "short",
          hour: "numeric",
          minute: "2-digit",
          hour12: true,
          timeZone: tz,
        }).format(new Date(TEST_TIME))}`;
      const testLocation = TEST_LOCATION
        ? " · Test location"
        : TEST_LOCATION_RAW ? " · Invalid test location" : "";
      $("subtitle").textContent = `App v${APP_VERSION}${dataVersion ? ` · data ${dataVersion}` : ""}${testClock}${testLocation}${navigator.onLine ? "" : " · Offline"}`;
    }

    function updateConnectionStatus() {
      updateSubtitle();
      if (state.tab === "settings" && state.offlineSettings.loaded) renderSettings();
    }

    window.addEventListener("online", updateConnectionStatus);
    window.addEventListener("offline", updateConnectionStatus);
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      installPromptEvent = event;
      if (state.tab === "settings") renderSettings();
    });
    window.addEventListener("appinstalled", () => {
      installPromptEvent = null;
      state.offlineSettings.message = "Shambala was installed successfully.";
      if (state.tab === "settings") renderSettings();
    });
    updateConnectionStatus();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        state.offlineSettings.loaded = false;
        if (state.tab === "settings") refreshOfflineSettings("Offline system updated.");
      });
      navigator.serviceWorker.register("./service-worker.js").catch((error) => {
        console.warn("Service worker registration failed", error);
      });
    }

    init();
    setInterval(() => {
      if (state.data && state.tab === "timetable" && !state.selected) render();
    }, 60000);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#314a34">
  <title>Shambala 2026 festival guide</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css">
  <style>
    :root {
      --paper: #f5eddd;
      --ink: #1b1713;
      --muted: #6b6257;
      --yellow: #f0b429;
      --olive: #314a34;
      --card: #fffaf1;
      --line: #e2d6bf;
      --shadow-sm: 0 4px 14px rgba(40, 28, 12, 0.07);
      --shadow: 0 24px 60px rgba(28, 22, 15, 0.22);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      background:
        radial-gradient(circle at top left, rgba(240, 180, 41, 0.2), transparent 30rem),
        var(--paper);
      color: var(--ink);
    }
    .wrap { max-width: 1160px; margin: 0 auto; padding: 24px 20px 80px; }

    header.hero {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-bottom: 20px;
      padding: 20px 22px;
      border-radius: 20px;
      background: var(--olive);
      color: #fffaf1;
      box-shadow: var(--shadow-sm);
    }
    header.hero img.logo {
      height: 58px;
      width: auto;
      max-width: min(42vw, 220px);
      display: block;
      object-fit: contain;
    }
    header.hero h1 {
      font-size: clamp(1.35rem, 3vw, 1.75rem);
      letter-spacing: 0.02em;
      margin: 0;
    }
    header.hero p {
      margin: 4px 0 0;
      color: rgba(255, 250, 241, 0.72);
      font-size: 0.95rem;
    }

    .primary-nav {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-bottom: 14px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 250, 241, 0.78);
      box-shadow: var(--shadow-sm);
    }
    .primary-nav button {
      min-width: 0;
      min-height: 44px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      font: 700 1rem/1 Georgia, serif;
      cursor: pointer;
    }
    .primary-nav button.active {
      background: var(--olive);
      color: #fff;
    }

    .controls {
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 250, 241, 0.72);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(8px);
    }
    .view-toggle {
      display: inline-grid;
      grid-template-columns: repeat(3, 1fr);
      justify-self: start;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
    }
    .view-toggle button {
      min-width: 0;
      min-height: 38px;
      padding: 7px 16px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .view-toggle button.active {
      background: var(--olive);
      color: #fff;
      box-shadow: 0 2px 8px rgba(40, 28, 12, 0.16);
    }
    .days {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }
    .days button, .chip, .icon-btn {
      font: inherit;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }
    .days button:hover, .chip:hover, .icon-btn:hover { border-color: #b9a98c; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline: 3px solid rgba(240, 180, 41, 0.55);
      outline-offset: 2px;
    }
    .days button {
      white-space: nowrap;
      border-radius: 999px;
      padding: 9px 15px;
    }
    .days button .sub {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .days button.active {
      background: var(--olive);
      border-color: var(--olive);
      color: #fff;
    }
    .days button.active .sub { color: rgba(255,255,255,0.78); }

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .tools input, .tools select {
      font: inherit;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 12px;
      min-height: 44px;
      padding: 10px 13px;
      color: var(--ink);
    }
    .tools input { flex: 1; min-width: 180px; }
    .tools .action-btn.active {
      border-color: #d49a12;
      background: var(--yellow);
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.86rem;
    }
    .chip.active { background: var(--yellow); border-color: #d49a12; }

    .status { color: var(--muted); margin: 10px 2px 14px; font-size: 0.92rem; }
    .section-head {
      display: flex;
      gap: 12px;
      align-items: end;
      justify-content: space-between;
      margin: 4px 2px 14px;
    }
    .section-head h2 { margin: 0; font-size: 1.5rem; }
    .section-head p { margin: 4px 0 0; color: var(--muted); }
    .subnav {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      margin-bottom: 14px;
      padding: 2px 1px 5px;
      scrollbar-width: thin;
    }
    .subnav button, .action-btn, .back-btn {
      flex: 0 0 auto;
      min-height: 38px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }
    .subnav button.active {
      border-color: #d49a12;
      background: var(--yellow);
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 14px;
    }
    .content-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      box-shadow: var(--shadow-sm);
    }
    .content-card > button.card-main {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .content-card img {
      display: block;
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: #ddd3bf;
    }
    .content-card .card-body { padding: 13px 14px; }
    .content-card h3 { margin: 0 0 5px; font-size: 1.08rem; }
    .eyebrow {
      margin-bottom: 5px;
      color: var(--olive);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .content-card .summary {
      display: -webkit-box;
      overflow: hidden;
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.4;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      line-clamp: 3;
    }
    .content-card .card-actions {
      display: flex;
      gap: 7px;
      padding: 0 14px 13px;
    }
    .content-card .card-actions button { flex: 1; }
    .article {
      max-width: 780px;
      margin: 0 auto;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      box-shadow: var(--shadow-sm);
    }
    .article .back-btn { margin-bottom: 18px; }
    .article > img {
      width: calc(100% + 48px);
      max-height: 430px;
      margin: -24px -24px 22px;
      object-fit: cover;
    }
    .article h2 { margin: 0 0 6px; font-size: clamp(1.6rem, 4vw, 2.25rem); }
    .article .article-meta { color: var(--muted); }
    .article .article-body { margin-top: 22px; line-height: 1.65; }
    .article .article-body a { overflow-wrap: anywhere; }
    .article .article-body li { margin-bottom: 7px; }
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 14px;
    }
    .setting-card {
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      box-shadow: var(--shadow-sm);
    }
    .setting-card h3 { margin: 0 0 7px; }
    .setting-card p { color: var(--muted); line-height: 1.45; }
    .setting-card .metric {
      margin: 8px 0;
      color: var(--ink);
      font-size: 1.15rem;
      font-weight: 700;
    }
    .setting-actions { display: flex; flex-wrap: wrap; gap: 7px; }
    .setting-actions button { flex: 1 1 auto; }
    .progress-track {
      overflow: hidden;
      height: 9px;
      margin: 12px 0 7px;
      border-radius: 999px;
      background: var(--line);
    }
    .progress-track span {
      display: block;
      width: var(--progress, 0%);
      height: 100%;
      border-radius: inherit;
      background: var(--yellow);
      transition: width 0.15s ease;
    }
    .settings-message { min-height: 1.3em; color: var(--olive); font-weight: 700; }
    .danger { color: #8a2f27; }
    .map-panel {
      --marker-scale: 0.3;
      position: relative;
      overflow: hidden;
      min-height: 640px;
      height: min(76vh, 860px);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #dce5d3;
      box-shadow: var(--shadow-sm);
    }
    #map { width: 100%; height: 100%; }
    .map-label-controls {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 3;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-width: calc(100% - 24px);
    }
    .map-label-controls button {
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid rgba(49, 74, 52, 0.2);
      border-radius: 999px;
      background: rgba(255, 250, 241, 0.9);
      color: var(--olive);
      box-shadow: var(--shadow-sm);
      font: 700 0.8rem/1 Georgia, serif;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }
    .map-label-controls button.active {
      border-color: #bd8200;
      background: var(--yellow);
      color: var(--ink);
    }
    .maplibregl-popup-content {
      max-width: 260px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--card);
      color: var(--ink);
      box-shadow: var(--shadow-sm);
      font-family: inherit;
    }
    .maplibregl-popup-content strong { display: block; padding-right: 12px; font-size: 1rem; }
    .maplibregl-popup-content span { color: var(--muted); font-size: 0.84rem; }
    .maplibregl-popup-close-button { padding: 3px 7px; font-size: 1.1rem; }
    .map-marker {
      --marker-color: #4f6652;
      position: absolute;
      display: grid;
      place-items: center;
      width: calc(28px * var(--marker-scale));
      height: calc(28px * var(--marker-scale));
      padding: calc(5px * var(--marker-scale));
      border: 2px solid #fffaf1;
      border-radius: 50%;
      background: var(--marker-color);
      color: #fff;
      box-shadow: 0 2px 7px rgba(27, 23, 19, 0.38);
      cursor: pointer;
      transition: filter 0.15s ease;
    }
    .map-marker:hover, .map-marker:focus-visible {
      z-index: 5;
      filter: brightness(1.08);
    }
    .map-marker svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .map-marker.stage {
      z-index: 2;
      width: calc(40px * var(--marker-scale));
      height: calc(40px * var(--marker-scale));
      padding: calc(7px * var(--marker-scale));
      border-radius: 12px;
    }
    .map-marker .marker-label {
      display: none;
      position: absolute;
      left: calc(100% + 5px);
      top: 50%;
      max-width: 150px;
      transform: translateY(-50%);
      padding: 3px 6px;
      border: 1px solid rgba(86, 43, 113, 0.24);
      border-radius: 6px;
      background: rgba(255, 250, 241, 0.9);
      color: #49235d;
      box-shadow: 0 1px 4px rgba(27, 23, 19, 0.18);
      font: 700 0.72rem/1.15 Georgia, serif;
      text-align: left;
      white-space: nowrap;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
    .test-location-marker {
      position: relative;
      width: 18px;
      height: 18px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: #2878d0;
      box-shadow:
        0 1px 5px rgba(19, 45, 78, 0.48),
        0 0 0 12px rgba(40, 120, 208, 0.2);
      pointer-events: none;
    }
    .test-location-marker span {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 12px);
      transform: translateX(-50%);
      padding: 3px 6px;
      border: 1px solid rgba(40, 120, 208, 0.35);
      border-radius: 6px;
      background: rgba(255, 250, 241, 0.94);
      color: #1e568f;
      box-shadow: var(--shadow-sm);
      font: 700 0.72rem/1.2 Georgia, serif;
      white-space: nowrap;
    }
    .map-panel.show-stage-labels .map-marker.stage .marker-label,
    .map-panel.show-activity-labels .map-marker.activity-space .marker-label {
      display: block;
    }
    .error {
      background: #fff1e8;
      border: 1px solid #e8b89a;
      padding: 14px 16px;
      border-radius: 14px;
    }
    .error code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.86em; }

    .venue {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .venue-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 13px 16px;
      border: 0;
      border-bottom: 1px solid var(--line);
      font-size: 1.08rem;
      font-family: inherit;
      font-weight: 700;
      text-align: left;
      background: rgba(49, 74, 52, 0.09);
      color: inherit;
      cursor: pointer;
    }
    .venue-title:hover { background: rgba(49, 74, 52, 0.14); }
    .venue-title[aria-expanded="false"] { border-bottom: 0; }
    .venue-title .venue-chevron { color: var(--muted); font-size: 0.9rem; }
    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      width: 100%;
      border-top: 1px solid var(--line);
      background: transparent;
    }
    .row:first-of-type { border-top: 0; }
    .row:hover { background: rgba(240, 180, 41, 0.11); }
    .row.past {
      opacity: 0.48;
      background: rgba(92, 82, 67, 0.04);
    }
    .row.past:hover { opacity: 0.72; }
    .row.live {
      background: rgba(240, 180, 41, 0.2);
      box-shadow: inset 5px 0 0 #d49a12;
    }
    .row.live:hover { background: rgba(240, 180, 41, 0.28); }
    .row-main {
      display: grid;
      grid-template-columns: 92px 64px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      min-width: 0;
      padding: 11px 12px 11px 16px;
      border: 0;
      background: transparent;
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }
    .row .when { font-variant-numeric: tabular-nums; font-size: 0.88rem; color: var(--olive); }
    .time-state {
      display: inline-block;
      margin-top: 5px;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(49, 74, 52, 0.1);
      color: var(--olive);
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 1.25;
    }
    .row.live .time-state {
      background: #d49a12;
      color: #fff;
    }
    .now-group { margin-bottom: 18px; }
    .now-group > h2 { margin: 2px 2px 9px; font-size: 1.25rem; }
    .now-group .venue { margin-bottom: 0; }
    .now-group .row .meta .venue-name { color: var(--olive); font-weight: 700; }
    .search-panel {
      max-width: 820px;
      margin: 0 auto 18px;
    }
    .search-panel input {
      width: 100%;
      min-height: 52px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--card);
      color: var(--ink);
      font: inherit;
      font-size: 1.05rem;
      box-shadow: var(--shadow-sm);
    }
    .search-group { max-width: 820px; margin: 0 auto 22px; }
    .search-group h3 { margin: 0 2px 8px; color: var(--olive); }
    .search-results {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      box-shadow: var(--shadow-sm);
    }
    .search-result {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      width: 100%;
      min-height: 68px;
      padding: 8px 12px;
      border: 0;
      border-top: 1px solid var(--line);
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .search-result:first-child { border-top: 0; }
    .search-result:hover { background: rgba(240, 180, 41, 0.11); }
    .search-result img, .search-result .search-icon {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background: rgba(49, 74, 52, 0.1);
      object-fit: cover;
      color: var(--olive);
      font-size: 1.25rem;
    }
    .search-result strong, .search-result small { display: block; }
    .search-result small { margin-top: 3px; color: var(--muted); line-height: 1.3; }
    .row img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 10px;
      background: #ddd3bf;
    }
    .row .name { font-weight: 700; }
    .row .meta { color: var(--muted); font-size: 0.86rem; margin-top: 3px; }
    .star {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      margin-right: 12px;
      padding: 0 0 2px;
      border: 1px solid transparent;
      border-radius: 50%;
      background: transparent;
      color: #8b806f;
      font: 1.55rem/1 Georgia, serif;
      cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }
    .star:hover { color: #a87400; background: rgba(240, 180, 41, 0.13); }
    .star.active { color: #bd8200; }
    .star:active { transform: scale(0.9); }

    .drawer-bg {
      position: fixed;
      inset: 0;
      z-index: 4;
      background: rgba(27, 23, 19, 0.58);
      backdrop-filter: blur(2px);
      display: none;
    }
    .drawer-bg.open { display: block; }
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      width: min(560px, 100%);
      background: var(--card);
      box-shadow: var(--shadow);
      transform: translateX(110%);
      transition: transform 0.22s ease;
      overflow: auto;
      z-index: 5;
      overscroll-behavior: contain;
    }
    .drawer.open { transform: none; }
    .drawer img.hero {
      display: block;
      width: 100%;
      height: auto;
      max-height: min(58vh, 520px);
      object-fit: contain;
      background:
        linear-gradient(135deg, rgba(49, 74, 52, 0.96), rgba(27, 23, 19, 0.96));
    }
    .drawer .body { padding: 22px 22px 48px; }
    .drawer .title-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      justify-content: space-between;
    }
    .drawer h2 { margin: 0 0 8px; font-size: 1.55rem; line-height: 1.15; }
    .drawer .title-row .star { flex: 0 0 auto; margin: -7px -7px 0 0; }
    .drawer .when { color: var(--olive); margin-bottom: 12px; line-height: 1.45; }
    .drawer .desc { white-space: pre-wrap; line-height: 1.58; }
    .drawer .article-body { margin-top: 20px; line-height: 1.65; }
    .drawer .article-body li { margin-bottom: 7px; }
    .drawer-section { margin-top: 24px; }
    .drawer-section > h3 { margin: 0 0 10px; font-size: 1.05rem; }
    .video {
      position: relative;
      overflow: hidden;
      width: 100%;
      padding-top: 56.25%;
      border-radius: 12px;
      background: #1b1713;
    }
    .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .link-list { display: flex; flex-wrap: wrap; gap: 7px; }
    .link-list a, .drawer .action-btn {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      text-decoration: none;
    }
    blockquote {
      margin: 10px 0;
      padding: 12px 14px;
      border-left: 4px solid var(--yellow);
      background: var(--paper);
      line-height: 1.5;
    }
    blockquote footer { margin-top: 7px; color: var(--muted); font-size: 0.86rem; }
    .related-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .related-card {
      overflow: hidden;
      min-width: 0;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--paper);
      color: inherit;
      font: inherit;
      text-align: left;
    }
    button.related-card { cursor: pointer; }
    .related-card img { width: 100%; height: 90px; object-fit: cover; background: #ddd3bf; }
    .related-card span { display: block; padding: 8px 9px; font-weight: 700; }
    .warn {
      display: inline-block;
      margin: 0 6px 8px 0;
      padding: 3px 8px;
      border-radius: 999px;
      background: #f7d7c8;
      font-size: 0.78rem;
    }
    .also { margin-top: 18px; }
    .also button {
      display: block;
      width: 100%;
      text-align: left;
      margin-top: 6px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--paper);
      font: inherit;
      cursor: pointer;
    }
    .close {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--card);
      box-shadow: 0 2px 10px rgba(27, 23, 19, 0.2);
    }
    a { color: var(--olive); }
    @media (max-width: 640px) {
      .wrap { padding: 12px 10px 60px; }
      header.hero { gap: 14px; padding: 16px; border-radius: 16px; }
      header.hero img.logo { height: 44px; max-width: 38vw; }
      header.hero p { font-size: 0.85rem; }
      .controls { padding: 12px; border-radius: 16px; }
      .primary-nav { position: sticky; top: 6px; z-index: 3; }
      .primary-nav button { min-height: 40px; padding-inline: 2px; font-size: 0.74rem; }
      .view-toggle { width: 100%; }
      .view-toggle button { padding-inline: 5px; font-size: 0.82rem; }
      .tools { align-items: stretch; }
      .tools input, .tools select { width: 100%; }
      .map-panel { min-height: 520px; height: 72vh; border-radius: 16px; }
      .row-main { grid-template-columns: 78px 52px minmax(0, 1fr); gap: 8px; padding: 10px 6px 10px 10px; }
      .row img { width: 52px; height: 52px; }
      .star { width: 40px; height: 40px; margin-right: 6px; }
      .drawer .body { padding: 18px 16px 40px; }
      .card-grid { grid-template-columns: 1fr; }
      .article { padding: 18px 16px; }
      .article > img { width: calc(100% + 32px); margin: -18px -16px 18px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <img class="logo" id="logo" alt="Shambala" hidden>
      <div>
        <h1 id="title">Shambala festival guide</h1>
        <p id="subtitle">Loading merged festival data…</p>
      </div>
    </header>

    <nav class="primary-nav" id="primaryNav" aria-label="Main sections"></nav>

    <div class="controls" id="controls" hidden>
      <div class="view-toggle" id="viewToggle" role="group" aria-label="View"></div>
      <div class="days" id="days"></div>
      <div class="tools" id="tools">
        <input id="search" type="search" placeholder="Search acts, venues, categories…">
        <select id="venue"></select>
        <button class="action-btn" id="hideFinished" type="button" aria-pressed="false">Hide finished</button>
      </div>
      <div class="chips" id="cats"></div>
    </div>

    <div class="map-panel" id="mapView" hidden>
      <div class="map-label-controls" id="mapLabelControls" aria-label="Map labels">
        <button type="button" data-map-label="stages" aria-pressed="false">Stage names</button>
        <button type="button" data-map-label="activities" aria-pressed="false">Activity names</button>
      </div>
      <div id="map" aria-label="Festival map"></div>
    </div>
    <section id="exploreView" hidden></section>
    <section id="infoView" hidden></section>
    <section id="searchView" hidden></section>
    <section id="settingsView" hidden></section>
    <div class="status" id="status"></div>
    <div id="list"></div>
  </div>

  <div class="drawer-bg" id="drawerBg"></div>
  <aside class="drawer" id="drawer"></aside>

  <script type="module">
    import * as maplibregl from "./vendor/maplibre-gl/maplibre-gl.mjs";

    const APP_VERSION = "0.3.1";
    const DATA_URL = "data/merged.json";
    const IMAGE_DIR = "images-data";
    const PLAN_STORAGE_KEY = "shambala-2026:festival-plan";
    const MAP_PREFS_STORAGE_KEY = "shambala-2026:map-preferences";
    const TIMETABLE_PREFS_STORAGE_KEY = "shambala-2026:timetable-preferences";
    const TEST_TIME_RAW = new URLSearchParams(location.search).get("testTime");
    const TEST_TIME = TEST_TIME_RAW && Number.isFinite(Date.parse(TEST_TIME_RAW))
      ? Date.parse(TEST_TIME_RAW)
      : null;
    const TEST_LOCATION_RAW = new URLSearchParams(location.search).get("testLocation");
    const TEST_LOCATION = (() => {
      const [longitude, latitude] = String(TEST_LOCATION_RAW || "").split(",").map(Number);
      return Number.isFinite(longitude) && Number.isFinite(latitude)
        && longitude >= -180 && longitude <= 180 && latitude >= -90 && latitude <= 90
        ? [longitude, latitude]
        : null;
    })();

    const state = {
      data: null,
      day: null,
      tab: "timetable",
      timetableView: "all",
      exploreBucket: "stages",
      infoCategory: "news",
      query: "",
      globalQuery: "",
      category: "",
      venue: "",
      hideFinished: false,
      selected: null,
      selectedPoi: null,
      selectedPost: null,
      selectedMerch: null,
      selectedPartner: null,
      favorites: new Set(),
      collapsedVenues: new Set(),
      mapLabels: { stages: false, activities: false },
      offlineSettings: {
        loading: false,
        loaded: false,
        status: null,
        storage: null,
        persistent: false,
        progress: null,
        message: ""
      },
    };

    const $ = (id) => document.getElementById(id);
    const serviceWorkersAvailable = "serviceWorker" in navigator;
    let installPromptEvent = null;
    let festivalMap = null;
    const mapMarkers = new Map();
    let offlineRefreshId = 0;

    function appNow() {
      return TEST_TIME ?? Date.now();
    }

    function imgPath(name, fallback) {
      const file = name || fallback || "";
      return file ? `${IMAGE_DIR}/${file}` : "";
    }

    function loadFavorites() {
      try {
        const saved = JSON.parse(localStorage.getItem(PLAN_STORAGE_KEY));
        return new Set(Array.isArray(saved?.sessionIds) ? saved.sessionIds : []);
      } catch {
        return new Set();
      }
    }

    function saveFavorites() {
      try {
        localStorage.setItem(PLAN_STORAGE_KEY, JSON.stringify({
          version: 1,
          sessionIds: [...state.favorites],
        }));
      } catch {
        // The timetable still works if storage is unavailable.
      }
    }

    function loadMapPreferences() {
      try {
        const saved = JSON.parse(localStorage.getItem(MAP_PREFS_STORAGE_KEY));
        return {
          stages: saved?.stages === true,
          activities: saved?.activities === true,
        };
      } catch {
        return { stages: false, activities: false };
      }
    }

    function updateMapLabelControls() {
      $("mapView").classList.toggle("show-stage-labels", state.mapLabels.stages);
      $("mapView").classList.toggle("show-activity-labels", state.mapLabels.activities);
      for (const button of $("mapLabelControls").querySelectorAll("button[data-map-label]")) {
        const active = state.mapLabels[button.dataset.mapLabel];
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      }
    }

    function saveMapPreferences() {
      try {
        localStorage.setItem(MAP_PREFS_STORAGE_KEY, JSON.stringify(state.mapLabels));
      } catch {
        // Map label toggles still work for the current page.
      }
    }

    function loadTimetablePreferences() {
      try {
        const saved = JSON.parse(localStorage.getItem(TIMETABLE_PREFS_STORAGE_KEY));
        return { hideFinished: saved?.hideFinished === true };
      } catch {
        return { hideFinished: false };
      }
    }

    function saveTimetablePreferences() {
      try {
        localStorage.setItem(TIMETABLE_PREFS_STORAGE_KEY, JSON.stringify({
          hideFinished: state.hideFinished,
        }));
      } catch {
        // Timetable controls still work for the current page.
      }
    }

    function toggleFavorite(id) {
      if (state.favorites.has(id)) {
        state.favorites.delete(id);
      } else {
        state.favorites.add(id);
      }
      mediaPackageCache.delete("festival");
      saveFavorites();
      render();
    }

    function starButton(ev, extraClass = "") {
      const active = state.favorites.has(ev.session.id);
      const action = active ? "Remove" : "Add";
      return `<button class="star ${active ? "active" : ""} ${extraClass}" data-favorite="${ev.session.id}"
        aria-pressed="${active}" aria-label="${action} ${ev.entity.name} ${active ? "from" : "to"} My Festival"
        title="${action} ${active ? "from" : "to"} My Festival">${active ? "★" : "☆"}</button>`;
    }

    function fmtDay(iso, tz) {
      const date = new Date(iso);
      const weekday = new Intl.DateTimeFormat("en-GB", { weekday: "long", timeZone: tz }).format(date);
      const short = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", timeZone: tz }).format(date);
      return { weekday, short };
    }

    function fmtTime(iso, tz) {
      return new Intl.DateTimeFormat("en-GB", {
        hour: "numeric",
        minute: "2-digit",
        hour12: true,
        timeZone: tz,
      }).format(new Date(iso));
    }

    function fmtRange(start, end, tz) {
      return `${fmtTime(start, tz)} – ${fmtTime(end, tz)}`;
    }

    function temporalState(session, now = appNow()) {
      const start = Date.parse(session.start);
      const end = Date.parse(session.end);
      if (!Number.isFinite(start) || !Number.isFinite(end)) return "unknown";
      if (now >= end) return "past";
      if (now >= start) return "live";
      return "upcoming";
    }

    function relativeStart(start, now = appNow()) {
      const minutes = Math.max(0, Math.ceil((Date.parse(start) - now) / 60000));
      if (minutes < 1) return "Starting now";
      if (minutes < 60) return `Starts in ${minutes}m`;
      const hours = Math.floor(minutes / 60);
      const remainder = minutes % 60;
      return `Starts in ${hours}h${remainder ? ` ${remainder}m` : ""}`;
    }

    function currentFestivalDay(data, now = appNow()) {
      const markers = dayKeys(data).filter((marker) => Number.isFinite(Date.parse(marker)));
      if (!markers.length) return null;
      return markers.slice().reverse().find((marker) => Date.parse(marker) <= now) || markers[0];
    }

    function dayKeys(data) {
      const tz = data.config?.app?.tz || "Europe/London";
      const fromConfig = data.config?.app?.timeMarkers || [];
      const fromSessions = data.entitySessions.map((s) => s.timeMarker).filter(Boolean);
      return [...new Set([...fromConfig, ...fromSessions])].sort();
    }

    function buildIndexes(data) {
      const entities = Object.fromEntries(data.entities.map((e) => [e.id, e]));
      const pois = Object.fromEntries(data.poi.map((p) => [p.id, p]));
      const categories = Object.fromEntries(data.categories.map((c) => [c.id, c]));
      const subcategories = Object.fromEntries(data.subcategories.map((c) => [c.id, c]));
      return { entities, pois, categories, subcategories };
    }

    function eventRecord(session, indexes) {
      const entity = indexes.entities[session.entityId];
      const venue = indexes.pois[session.location];
      const cats = (session.category || []).map((id) => indexes.categories[id]).filter(Boolean);
      const subs = (session.subcategory || []).map((id) => indexes.subcategories[id]).filter(Boolean);
      return { session, entity, venue, cats, subs };
    }

    function poiCoordinates(poi) {
      const coordinates = Array.isArray(poi?.gps?.coordinates)
        ? poi.gps.coordinates
        : [poi?.gps?.longitude, poi?.gps?.latitude];
      const [longitude, latitude] = coordinates;
      return coordinates.length === 2
        && Number.isFinite(longitude) && longitude >= -180 && longitude <= 180
        && Number.isFinite(latitude) && latitude >= -90 && latitude <= 90
        ? [longitude, latitude]
        : null;
    }

    function markerIcon(type) {
      const icons = {
        stage: `<path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/>`,
        toilets: `<circle cx="8" cy="5" r="2"/><path d="M8 8v6m-3 7 2-7h2l2 7M16 3v18M20 5h.01"/>`,
        ladyToilets: `<circle cx="12" cy="5" r="2"/><path d="M12 8v5m-4 4 3-7h2l3 7h-8Zm4 0v4"/>`,
        pint: `<path d="M6 4h11l-1 16H8L6 4Zm11 3h2a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-3M7 8h9"/>`,
        waterPoints: `<path d="M12 2s6 7 6 12a6 6 0 0 1-12 0c0-5 6-12 6-12Z"/><path d="M9 15a3 3 0 0 0 3 2"/>`,
        foodDrink: `<path d="M7 3v7m-3-7v4a3 3 0 0 0 6 0V3M7 10v11M16 3v18m0-18c3 2 4 5 4 8h-4"/>`,
        firstAid: `<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6V3Z"/>`,
        entrance: `<path d="M4 21h13V3H4M9 12h12m-4-4 4 4-4 4"/>`,
        showers: `<path d="M5 10a7 7 0 0 1 14 0M5 10h14M8 14v.01M12 14v.01M16 14v.01M7 18v.01M11 18v.01M15 18v.01M19 18v.01"/>`,
        accessible: `<circle cx="10" cy="4" r="2"/><path d="M10 7v6h5l3 5m-8-8H6m5 5a5 5 0 1 1-3-5"/>`,
        information: `<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/>`,
        reception: `<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/>`,
        shop: `<path d="M5 8h14l-1 13H6L5 8Zm3 0a4 4 0 0 1 8 0"/>`,
        activitySpaces: `<path d="m12 2 2.2 6.8H21l-5.5 4 2.1 6.7-5.6-4.1-5.6 4.1 2.1-6.7-5.5-4h6.8L12 2Z"/>`,
        fireSafety: `<path d="M13 2s1 4-2 7c-2-2-4-1-4-1s-3 4-1 8a7 7 0 0 0 13-3c0-5-6-11-6-11Zm-1 19c-2 0-3-1-3-3 0-1 1-3 3-4 0 2 3 2 3 4s-1 3-3 3Z"/>`,
        ticket: `<path d="M3 9a3 3 0 0 0 0 6v4h18v-4a3 3 0 0 0 0-6V5H3v4Zm9-2v2m0 3v2m0 3v2"/>`,
        photo: `<path d="M4 7h4l2-3h4l2 3h4v13H4V7Z"/><circle cx="12" cy="13" r="4"/>`,
        wasteDisposal: `<path d="M5 7h14m-9-3h4m-7 3 1 14h8l1-14M10 11v6m4-6v6"/>`,
        washingUp: `<circle cx="12" cy="13" r="7"/><path d="M7 13h10M18 4h.01M21 7h.01"/>`,
        phoneCharging: `<path d="M8 2h8v20H8V2Zm0 4h8m-5 13h2"/><path d="m12 8-2 4h3l-1 4 3-6h-3V8Z"/>`,
        accommodation: `<path d="m3 21 9-18 9 18H3Zm9-18v18m-5 0 5-7 5 7"/>`,
        charity: `<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>`,
      };
      return `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[type] || `<path d="M12 21s7-6 7-12a7 7 0 0 0-14 0c0 6 7 12 7 12Z"/><circle cx="12" cy="9" r="2"/>`}</svg>`;
    }

    function markerColor(type) {
      return {
        stage: "#713b8c",
        toilets: "#297c82",
        ladyToilets: "#9a4f78",
        pint: "#a65d16",
        waterPoints: "#2477a8",
        foodDrink: "#c85d3d",
        firstAid: "#b83f3f",
        entrance: "#397544",
        showers: "#4285a4",
        accessible: "#286c9f",
        information: "#5261a5",
        reception: "#5261a5",
        shop: "#8a5b35",
        activitySpaces: "#8b5b9f",
        fireSafety: "#c64b2f",
        ticket: "#9a6b18",
        photo: "#65518f",
        wasteDisposal: "#56675a",
        washingUp: "#4b7d71",
        phoneCharging: "#697331",
        accommodation: "#567044",
        charity: "#a34866",
      }[type] || "#4f6652";
    }

    function addPoiMarkers(map, pois, categories) {
      for (const poi of pois) {
        const category = categories[poi.category];
        const type = category?.type || poi.type || "location";
        const icon = category?.icon || type;
        const labelType = type === "stage" ? "stage" : type === "activity-spaces" ? "activity-space" : "";
        const marker = document.createElement("button");
        marker.type = "button";
        marker.className = `map-marker${labelType ? ` ${labelType}` : ""}`;
        marker.style.setProperty("--marker-color", markerColor(icon));
        marker.setAttribute("aria-label", `${poi.name}, ${category?.name || "location"}`);
        marker.title = poi.name;
        marker.innerHTML = markerIcon(icon);
        if (labelType) {
          const label = document.createElement("span");
          label.className = "marker-label";
          label.textContent = poi.name;
          marker.append(label);
        }

        const content = document.createElement("div");
        const name = document.createElement("strong");
        const categoryName = document.createElement("span");
        name.textContent = poi.name;
        categoryName.textContent = category?.name || poi.type || "Location";
        content.append(name, categoryName);
        const popup = new maplibregl.Popup({ offset: type === "stage" ? 22 : 16 })
          .setDOMContent(content);
        const mapMarker = new maplibregl.Marker({ element: marker })
          .setLngLat(poiCoordinates(poi))
          .setPopup(popup)
          .addTo(map);
        mapMarkers.set(poi.id, mapMarker);
      }
    }

    function updateMarkerScale() {
      if (!festivalMap) return;
      const zoom = festivalMap.getZoom();
      const progress = Math.max(0, Math.min(1, (zoom - 12) / 4.5));
      const scale = 0.3 + (0.8 - 0.3) * progress ** 2;
      $("mapView").style.setProperty("--marker-scale", scale.toFixed(3));
    }

    function initMap(data) {
      if (festivalMap) {
        festivalMap.resize();
        return;
      }

      const app = data.config?.app || {};
      const bounds = app.mapBounds;
      const mapImage = app.images?.mapImage;
      if (!bounds || !mapImage) return;

      const categories = Object.fromEntries(data.categories.map((category) => [category.id, category]));
      const pois = data.poi.filter((poi) => poiCoordinates(poi));
      const corners = [
        [bounds.northWest.longitude, bounds.northWest.latitude],
        [bounds.northEast.longitude, bounds.northEast.latitude],
        [bounds.southEast.longitude, bounds.southEast.latitude],
        [bounds.southWest.longitude, bounds.southWest.latitude],
      ];

      festivalMap = new maplibregl.Map({
        container: "map",
        style: {
          version: 8,
          sources: {
            "festival-map": {
              type: "image",
              url: imgPath(mapImage),
              coordinates: corners,
            },
          },
          layers: [
            {
              id: "background",
              type: "background",
              paint: { "background-color": "#dce5d3" },
            },
            { id: "festival-map", type: "raster", source: "festival-map" },
          ],
        },
        bounds: [
          [bounds.southWest.longitude, bounds.southWest.latitude],
          [bounds.northEast.longitude, bounds.northEast.latitude],
        ],
        fitBoundsOptions: { padding: 24 },
        minZoom: 12,
        maxZoom: 19,
        attributionControl: false,
      });

      festivalMap.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");
      if ("geolocation" in navigator && window.isSecureContext) {
        festivalMap.addControl(new maplibregl.GeolocateControl({
          positionOptions: { enableHighAccuracy: true },
          trackUserLocation: true,
          showUserLocation: true,
          showAccuracyCircle: true,
          showUserHeading: false,
          fitBoundsOptions: { maxZoom: 17 },
        }), "bottom-right");
      }
      if (TEST_LOCATION) {
        const testMarker = document.createElement("div");
        testMarker.className = "test-location-marker";
        testMarker.setAttribute("role", "img");
        testMarker.setAttribute("aria-label", "Simulated test location");
        testMarker.innerHTML = "<span>Test location</span>";
        new maplibregl.Marker({ element: testMarker })
          .setLngLat(TEST_LOCATION)
          .addTo(festivalMap);
        festivalMap.once("load", () => {
          festivalMap.flyTo({ center: TEST_LOCATION, zoom: 16.5 });
        });
      }
      addPoiMarkers(festivalMap, pois, categories);
      festivalMap.on("zoom", updateMarkerScale);
      updateMarkerScale();
    }

    function closeDrawer() {
      state.selected = null;
      state.selectedPoi = null;
      state.selectedPost = null;
      state.selectedMerch = null;
      state.selectedPartner = null;
      $("drawer").classList.remove("open");
      $("drawerBg").classList.remove("open");
    }

    function detailHash(kind, id) {
      return `#${kind}/${encodeURIComponent(id)}`;
    }

    function exploreBucketForPoi(poi) {
      const category = state.data.categories.find((item) => item.id === poi.category);
      const type = category?.type || poi.type;
      return Object.entries(exploreBuckets).find(([, bucket]) =>
        bucket.types ? bucket.types.includes(type) : !bucket.exclude.includes(type)
      )?.[0] || "facilities";
    }

    function infoCategoryForPost(post) {
      if (post.category === "faq") return "faq";
      if (post.category === postCategoryId("Essential Info")) return "essential";
      return "news";
    }

    function applyRoute(hash = location.hash) {
      if (!state.data) return;
      closeDrawer();
      const [kind = "timetable", encodedId = ""] = hash.replace(/^#/, "").split("/");
      const id = decodeURIComponent(encodedId);

      if (kind === "act") {
        const session = state.data.entitySessions.find((item) => item.id === id);
        if (session) {
          state.tab = "timetable";
          state.day = session.timeMarker;
          state.selected = id;
        }
      } else if (kind === "place") {
        const poi = state.data.poi.find((item) => item.id === id);
        if (poi) {
          state.tab = "explore";
          state.exploreBucket = exploreBucketForPoi(poi);
          state.selectedPoi = id;
        }
      } else if (kind === "post") {
        const post = state.data.posts.find((item) => item.id === id);
        if (post) {
          state.tab = "info";
          state.infoCategory = infoCategoryForPost(post);
          state.selectedPost = id;
        }
      } else if (kind === "merch" && state.data.merchandise.some((item) => item.id === id)) {
        state.tab = "info";
        state.infoCategory = "merchandise";
        state.selectedMerch = id;
      } else if (kind === "partner" && state.data.partners.some((item) => item.id === id)) {
        state.tab = "info";
        state.infoCategory = "partners";
        state.selectedPartner = id;
      } else if (["timetable", "map", "explore", "info", "search", "settings"].includes(kind)) {
        state.tab = kind;
      } else {
        state.tab = "timetable";
      }
      render();
    }

    function navigateTab(tab) {
      history.pushState({ tab }, "", `#${tab}`);
      applyRoute();
    }

    async function shareCurrentDetail(button) {
      const shareUrl = new URL(location.href);
      shareUrl.searchParams.delete("testTime");
      shareUrl.searchParams.delete("testLocation");
      const url = shareUrl.href;
      const title = decodeURIComponent(button.dataset.shareTitle || "") || document.title;
      try {
        if (navigator.share) {
          await navigator.share({ title, url });
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(url);
          button.textContent = "Link copied";
          setTimeout(() => { button.textContent = "Share"; }, 1600);
        } else {
          const input = document.createElement("textarea");
          input.value = url;
          document.body.append(input);
          input.select();
          document.execCommand("copy");
          input.remove();
          button.textContent = "Link copied";
          setTimeout(() => { button.textContent = "Share"; }, 1600);
        }
      } catch (error) {
        if (error?.name !== "AbortError") button.textContent = "Could not share";
      }

    function youtubeId(raw) {
      let value = String(raw || "").trim().replace(/^=/, "");
      try {
        if (value.includes("youtu")) {
          const url = new URL(value.startsWith("http") ? value : `https://${value}`);
          value = url.hostname.includes("youtu.be") ? url.pathname.slice(1) : url.searchParams.get("v") || "";
        }
      } catch {
        return "";
      }
      value = value.split("&")[0].split("?")[0];
      return /^[\w-]{11}$/.test(value) ? value : "";
    }

    function safeExternalUrl(raw) {
      try {
        const url = new URL(raw);
        return ["http:", "https:"].includes(url.protocol) ? url.href : "";
      } catch {

      }
    }

    function sanitizeHtml(html) {
      const template = document.createElement("template");
      template.innerHTML = html || "";
      const allowed = new Set(["P", "A", "STRONG", "EM", "I", "B", "UL", "OL", "LI", "BR"]);
      for (const element of [...template.content.querySelectorAll("*")]) {
        if (!allowed.has(element.tagName)) {
          if (["SCRIPT", "STYLE", "IFRAME", "OBJECT"].includes(element.tagName)) {
            element.remove();
          } else {
            element.replaceWith(...element.childNodes);
          }
          continue;
        }
        const href = element.tagName === "A" ? safeExternalUrl(element.getAttribute("href")) : "";
        for (const attribute of [...element.attributes]) element.removeAttribute(attribute.name);
        if (href) {
          element.href = href;
          element.target = "_blank";
          element.rel = "noreferrer";
        }
      }
      return template.innerHTML;
    }

    function searchableText(...values) {
      return values.flat(Infinity)
        .filter((value) => value !== null && value !== undefined)
        .join(" ")
        .replace(/<[^>]*>/g, " ")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll('"', "&quot;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function searchMatches(haystack, query) {
      const words = searchableText(query).trim().split(/\s+/).filter(Boolean);
      return words.every((word) => haystack.includes(word));
    }

    function renderGlobalSearch(indexes, fallback) {
      const query = state.globalQuery.trim();
      const safeQuery = escapeHtml(query);
      const now = appNow();
      const sessionsByEntity = new Map();
      for (const session of state.data.entitySessions) {
        if (!sessionsByEntity.has(session.entityId)) sessionsByEntity.set(session.entityId, []);
        sessionsByEntity.get(session.entityId).push(session);
      }
      const representativeSession = (entityId) => {
        const sessions = (sessionsByEntity.get(entityId) || []).slice();
        return sessions
          .filter((session) => Date.parse(session.end) > now)
          .sort((a, b) => a.start.localeCompare(b.start))[0]
          || sessions.sort((a, b) => b.start.localeCompare(a.start))[0];
      };
      const rank = (name) => {
        const normalizedName = searchableText(name);
        const normalizedQuery = searchableText(query).trim();
        return normalizedName.startsWith(normalizedQuery) ? 0 : normalizedName.includes(normalizedQuery) ? 1 : 2;
      };
      const limitAndSort = (items) => items
        .sort((a, b) => rank(a.name) - rank(b.name) || a.name.localeCompare(b.name))
        .slice(0, 20);

      const groups = [];
      if (query.length >= 2) {
        const acts = limitAndSort(state.data.entities
          .map((entity) => {
            const sessions = sessionsByEntity.get(entity.id) || [];

            const venues = sessions.map((item) => indexes.pois[item.location]?.name);

            ),

        const merchandise = limitAndSort(state.data.merchandise
          .map((item) => ({

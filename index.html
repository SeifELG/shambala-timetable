<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shambala 2026 timetable</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.5.0/dist/maplibre-gl.css">
  <style>
    :root {
      --paper: #f5eddd;
      --ink: #1b1713;
      --muted: #6b6257;
      --yellow: #f0b429;
      --olive: #314a34;
      --card: #fffaf1;
      --line: #e2d6bf;
      --shadow-sm: 0 4px 14px rgba(40, 28, 12, 0.07);
      --shadow: 0 24px 60px rgba(28, 22, 15, 0.22);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      background:
        radial-gradient(circle at top left, rgba(240, 180, 41, 0.2), transparent 30rem),
        var(--paper);
      color: var(--ink);
    }

    .wrap { max-width: 1160px; margin: 0 auto; padding: 24px 20px 80px; }

    header.hero {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-bottom: 20px;
      padding: 20px 22px;
      border-radius: 20px;
      background: var(--olive);
      color: #fffaf1;
      box-shadow: var(--shadow-sm);
    }
    header.hero img.logo {
      height: 58px;
      width: auto;
      max-width: min(42vw, 220px);
      display: block;
      object-fit: contain;
    }
    header.hero h1 {
      font-size: clamp(1.35rem, 3vw, 1.75rem);
      letter-spacing: 0.02em;
      margin: 0;
    }
    header.hero p {
      margin: 4px 0 0;
      color: rgba(255, 250, 241, 0.72);
      font-size: 0.95rem;
    }

    .controls {
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 250, 241, 0.72);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(8px);
    }
    .view-toggle {
      display: inline-grid;
      grid-template-columns: repeat(3, 1fr);
      justify-self: start;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
    }
    .view-toggle button {
      min-height: 38px;
      padding: 7px 16px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .view-toggle button.active {
      background: var(--olive);
      color: #fff;
      box-shadow: 0 2px 8px rgba(40, 28, 12, 0.16);
    }
    .days {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }
    .days button, .chip, .icon-btn {
      font: inherit;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }
    .days button:hover, .chip:hover, .icon-btn:hover { border-color: #b9a98c; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline: 3px solid rgba(240, 180, 41, 0.55);
      outline-offset: 2px;
    }
    .days button {
      white-space: nowrap;
      border-radius: 999px;
      padding: 9px 15px;
    }
    .days button .sub {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .days button.active {
      background: var(--olive);
      border-color: var(--olive);
      color: #fff;
    }
    .days button.active .sub { color: rgba(255,255,255,0.78); }

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .tools input, .tools select {
      font: inherit;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 12px;
      min-height: 44px;
      padding: 10px 13px;
      color: var(--ink);
    }
    .tools input { flex: 1; min-width: 180px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.86rem;
    }
    .chip.active { background: var(--yellow); border-color: #d49a12; }

    .status { color: var(--muted); margin: 10px 2px 14px; font-size: 0.92rem; }
    .map-panel {
      position: relative;
      overflow: hidden;
      min-height: 640px;
      height: min(76vh, 860px);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #dce5d3;
      box-shadow: var(--shadow-sm);
    }
    #map { width: 100%; height: 100%; }
    .map-count {
      position: absolute;
      top: 12px;
      left: 50%;
      z-index: 2;
      transform: translateX(-50%);
      margin: 0;
      padding: 7px 12px;
      border: 1px solid rgba(49, 74, 52, 0.18);
      border-radius: 999px;
      background: rgba(255, 250, 241, 0.9);
      color: var(--olive);
      box-shadow: var(--shadow-sm);
      font-size: 0.86rem;
      white-space: nowrap;
      backdrop-filter: blur(6px);
    }
    .maplibregl-popup-content {
      max-width: 260px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--card);
      color: var(--ink);
      box-shadow: var(--shadow-sm);
      font-family: inherit;
    }
    .maplibregl-popup-content strong { display: block; padding-right: 12px; font-size: 1rem; }
    .maplibregl-popup-content span { color: var(--muted); font-size: 0.84rem; }
    .maplibregl-popup-close-button { padding: 3px 7px; font-size: 1.1rem; }
    .map-marker {
      --marker-color: #4f6652;
      position: absolute;
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 5px;
      border: 2px solid #fffaf1;
      border-radius: 50%;
      background: var(--marker-color);
      color: #fff;
      box-shadow: 0 2px 7px rgba(27, 23, 19, 0.38);
      cursor: pointer;
      transition: filter 0.15s ease;
    }
    .map-marker:hover, .map-marker:focus-visible {
      z-index: 5;
      filter: brightness(1.08);
    }
    .map-marker svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .map-marker.stage {
      z-index: 2;
      width: 40px;
      height: 40px;
      padding: 7px;
      border-radius: 12px;
    }
    .map-marker .marker-label {
      position: absolute;
      left: calc(100% + 5px);
      top: 50%;
      max-width: 150px;
      transform: translateY(-50%);
      padding: 3px 6px;
      border: 1px solid rgba(86, 43, 113, 0.24);
      border-radius: 6px;
      background: rgba(255, 250, 241, 0.9);
      color: #49235d;
      box-shadow: 0 1px 4px rgba(27, 23, 19, 0.18);
      font: 700 0.72rem/1.15 Georgia, serif;
      text-align: left;
      white-space: nowrap;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
    .error {
      background: #fff1e8;
      border: 1px solid #e8b89a;
      padding: 14px 16px;
      border-radius: 14px;
    }
    .error code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.86em; }

    .venue {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .venue h2 {
      margin: 0;
      padding: 13px 16px;
      font-size: 1.08rem;
      background: rgba(49, 74, 52, 0.09);
      border-bottom: 1px solid var(--line);
    }
    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      width: 100%;
      border-top: 1px solid var(--line);
      background: transparent;
    }
    .row:first-of-type { border-top: 0; }
    .row:hover { background: rgba(240, 180, 41, 0.11); }
    .row-main {
      display: grid;
      grid-template-columns: 92px 64px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      min-width: 0;
      padding: 11px 12px 11px 16px;
      border: 0;
      background: transparent;
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }
    .row .when { font-variant-numeric: tabular-nums; font-size: 0.88rem; color: var(--olive); }
    .row img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 10px;
      background: #ddd3bf;
    }
    .row .name { font-weight: 700; }
    .row .meta { color: var(--muted); font-size: 0.86rem; margin-top: 3px; }
    .star {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      margin-right: 12px;
      padding: 0 0 2px;
      border: 1px solid transparent;
      border-radius: 50%;
      background: transparent;
      color: #8b806f;
      font: 1.55rem/1 Georgia, serif;
      cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }
    .star:hover { color: #a87400; background: rgba(240, 180, 41, 0.13); }
    .star.active { color: #bd8200; }
    .star:active { transform: scale(0.9); }

    .drawer-bg {
      position: fixed;
      inset: 0;
      z-index: 4;
      background: rgba(27, 23, 19, 0.58);
      backdrop-filter: blur(2px);
      display: none;
    }
    .drawer-bg.open { display: block; }
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      width: min(460px, 100%);
      background: var(--card);
      box-shadow: var(--shadow);
      transform: translateX(110%);
      transition: transform 0.22s ease;
      overflow: auto;
      z-index: 5;
      overscroll-behavior: contain;
    }
    .drawer.open { transform: none; }
    .drawer img.hero {
      display: block;
      width: 100%;
      height: auto;
      max-height: min(58vh, 520px);
      object-fit: contain;
      background:
        linear-gradient(135deg, rgba(49, 74, 52, 0.96), rgba(27, 23, 19, 0.96));
    }
    .drawer .body { padding: 22px 22px 48px; }
    .drawer .title-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      justify-content: space-between;
    }
    .drawer h2 { margin: 0 0 8px; font-size: 1.55rem; line-height: 1.15; }
    .drawer .title-row .star { flex: 0 0 auto; margin: -7px -7px 0 0; }
    .drawer .when { color: var(--olive); margin-bottom: 12px; line-height: 1.45; }
    .drawer .desc { white-space: pre-wrap; line-height: 1.58; }
    .warn {
      display: inline-block;
      margin: 0 6px 8px 0;
      padding: 3px 8px;
      border-radius: 999px;
      background: #f7d7c8;
      font-size: 0.78rem;
    }
    .also { margin-top: 18px; }
    .also button {
      display: block;
      width: 100%;
      text-align: left;
      margin-top: 6px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--paper);
      font: inherit;
      cursor: pointer;
    }
    .close {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--card);
      box-shadow: 0 2px 10px rgba(27, 23, 19, 0.2);
    }
    a { color: var(--olive); }
    @media (max-width: 640px) {
      .wrap { padding: 12px 10px 60px; }
      header.hero { gap: 14px; padding: 16px; border-radius: 16px; }
      header.hero img.logo { height: 44px; max-width: 38vw; }
      header.hero p { font-size: 0.85rem; }
      .controls { padding: 12px; border-radius: 16px; }
      .view-toggle { width: 100%; }
      .view-toggle button { padding-inline: 10px; font-size: 0.9rem; }
      .tools { align-items: stretch; }
      .tools input, .tools select { width: 100%; }
      .map-panel { min-height: 520px; height: 72vh; border-radius: 16px; }
      .row-main { grid-template-columns: 78px 52px minmax(0, 1fr); gap: 8px; padding: 10px 6px 10px 10px; }
      .row img { width: 52px; height: 52px; }
      .star { width: 40px; height: 40px; margin-right: 6px; }
      .drawer .body { padding: 18px 16px 40px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <img class="logo" id="logo" alt="Shambala" hidden>
      <div>
        <h1 id="title">Shambala timetable</h1>
        <p id="subtitle">Loading merged festival data…</p>
      </div>
    </header>

    <div class="controls" id="controls" hidden>
      <div class="view-toggle" id="viewToggle" role="group" aria-label="View"></div>
      <div class="days" id="days"></div>
      <div class="tools" id="tools">
        <input id="search" type="search" placeholder="Search acts, venues, categories…">
        <select id="venue"></select>
      </div>
      <div class="chips" id="cats"></div>
    </div>

    <div class="map-panel" id="mapView" hidden>
      <p class="map-count" id="mapCount"></p>
      <div id="map" aria-label="Festival map"></div>
    </div>
    <div class="status" id="status"></div>
    <div id="list"></div>
  </div>

  <div class="drawer-bg" id="drawerBg"></div>
  <aside class="drawer" id="drawer"></aside>

  <script type="module">
    import * as maplibregl from "https://unpkg.com/maplibre-gl@6.5.0/dist/maplibre-gl.mjs";

    const DATA_URL = "data/merged.json";
    const IMAGE_DIR = "images-data";
    const PLAN_STORAGE_KEY = "shambala-2026:festival-plan";

    const state = {
      data: null,
      day: null,
      view: "all",
      query: "",
      category: "",
      venue: "",
      selected: null,
      favorites: new Set(),
    };

    const $ = (id) => document.getElementById(id);
    let festivalMap = null;

    function imgPath(name, fallback) {
      const file = name || fallback || "";
      return file ? `${IMAGE_DIR}/${file}` : "";
    }

    function loadFavorites() {
      try {
        const saved = JSON.parse(localStorage.getItem(PLAN_STORAGE_KEY));
        return new Set(Array.isArray(saved?.sessionIds) ? saved.sessionIds : []);
      } catch {
        return new Set();
      }
    }

    function saveFavorites() {
      try {
        localStorage.setItem(PLAN_STORAGE_KEY, JSON.stringify({
          version: 1,
          sessionIds: [...state.favorites],
        }));
      } catch {
        // The timetable still works if storage is unavailable.
      }
    }

    function toggleFavorite(id) {
      if (state.favorites.has(id)) {
        state.favorites.delete(id);
      } else {
        state.favorites.add(id);
      }
      saveFavorites();
      render();
    }

    function starButton(ev, extraClass = "") {
      const active = state.favorites.has(ev.session.id);
      const action = active ? "Remove" : "Add";
      return `<button class="star ${active ? "active" : ""} ${extraClass}" data-favorite="${ev.session.id}"
        aria-pressed="${active}" aria-label="${action} ${ev.entity.name} ${active ? "from" : "to"} My Festival"
        title="${action} ${active ? "from" : "to"} My Festival">${active ? "★" : "☆"}</button>`;
    }

    function fmtDay(iso, tz) {
      const date = new Date(iso);
      const weekday = new Intl.DateTimeFormat("en-GB", { weekday: "long", timeZone: tz }).format(date);
      const short = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", timeZone: tz }).format(date);
      return { weekday, short };
    }

    function fmtTime(iso, tz) {
      return new Intl.DateTimeFormat("en-GB", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false,
        timeZone: tz,
      }).format(new Date(iso));
    }

    function fmtRange(start, end, tz) {
      return `${fmtTime(start, tz)} – ${fmtTime(end, tz)}`;
    }

    function dayKeys(data) {
      const tz = data.config?.app?.tz || "Europe/London";
      const fromConfig = data.config?.app?.timeMarkers || [];
      const fromSessions = data.entitySessions.map((s) => s.timeMarker).filter(Boolean);
      return [...new Set([...fromConfig, ...fromSessions])].sort();
    }

    function buildIndexes(data) {
      const entities = Object.fromEntries(data.entities.map((e) => [e.id, e]));
      const pois = Object.fromEntries(data.poi.map((p) => [p.id, p]));
      const categories = Object.fromEntries(data.categories.map((c) => [c.id, c]));
      const subcategories = Object.fromEntries(data.subcategories.map((c) => [c.id, c]));
      return { entities, pois, categories, subcategories };
    }

    function eventRecord(session, indexes) {
      const entity = indexes.entities[session.entityId];
      const venue = indexes.pois[session.location];
      const cats = (session.category || []).map((id) => indexes.categories[id]).filter(Boolean);
      const subs = (session.subcategory || []).map((id) => indexes.subcategories[id]).filter(Boolean);
      return { session, entity, venue, cats, subs };
    }

    function markerIcon(type) {
      const icons = {
        stage: `<path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/>`,
        toilets: `<circle cx="8" cy="5" r="2"/><path d="M8 8v6m-3 7 2-7h2l2 7M16 3v18M20 5h.01"/>`,
        ladyToilets: `<circle cx="12" cy="5" r="2"/><path d="M12 8v5m-4 4 3-7h2l3 7h-8Zm4 0v4"/>`,
        pint: `<path d="M6 4h11l-1 16H8L6 4Zm11 3h2a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-3M7 8h9"/>`,
        waterPoints: `<path d="M12 2s6 7 6 12a6 6 0 0 1-12 0c0-5 6-12 6-12Z"/><path d="M9 15a3 3 0 0 0 3 2"/>`,
        foodDrink: `<path d="M7 3v7m-3-7v4a3 3 0 0 0 6 0V3M7 10v11M16 3v18m0-18c3 2 4 5 4 8h-4"/>`,
        firstAid: `<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6V3Z"/>`,
        entrance: `<path d="M4 21h13V3H4M9 12h12m-4-4 4 4-4 4"/>`,
        showers: `<path d="M5 10a7 7 0 0 1 14 0M5 10h14M8 14v.01M12 14v.01M16 14v.01M7 18v.01M11 18v.01M15 18v.01M19 18v.01"/>`,
        accessible: `<circle cx="10" cy="4" r="2"/><path d="M10 7v6h5l3 5m-8-8H6m5 5a5 5 0 1 1-3-5"/>`,
        information: `<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/>`,
        reception: `<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/>`,
        shop: `<path d="M5 8h14l-1 13H6L5 8Zm3 0a4 4 0 0 1 8 0"/>`,
        activitySpaces: `<path d="m12 2 2.2 6.8H21l-5.5 4 2.1 6.7-5.6-4.1-5.6 4.1 2.1-6.7-5.5-4h6.8L12 2Z"/>`,
        fireSafety: `<path d="M13 2s1 4-2 7c-2-2-4-1-4-1s-3 4-1 8a7 7 0 0 0 13-3c0-5-6-11-6-11Zm-1 19c-2 0-3-1-3-3 0-1 1-3 3-4 0 2 3 2 3 4s-1 3-3 3Z"/>`,
        ticket: `<path d="M3 9a3 3 0 0 0 0 6v4h18v-4a3 3 0 0 0 0-6V5H3v4Zm9-2v2m0 3v2m0 3v2"/>`,
        photo: `<path d="M4 7h4l2-3h4l2 3h4v13H4V7Z"/><circle cx="12" cy="13" r="4"/>`,
        wasteDisposal: `<path d="M5 7h14m-9-3h4m-7 3 1 14h8l1-14M10 11v6m4-6v6"/>`,
        washingUp: `<circle cx="12" cy="13" r="7"/><path d="M7 13h10M18 4h.01M21 7h.01"/>`,
        phoneCharging: `<path d="M8 2h8v20H8V2Zm0 4h8m-5 13h2"/><path d="m12 8-2 4h3l-1 4 3-6h-3V8Z"/>`,
        accommodation: `<path d="m3 21 9-18 9 18H3Zm9-18v18m-5 0 5-7 5 7"/>`,
        charity: `<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>`,
      };
      return `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[type] || `<path d="M12 21s7-6 7-12a7 7 0 0 0-14 0c0 6 7 12 7 12Z"/><circle cx="12" cy="9" r="2"/>`}</svg>`;
    }

    function markerColor(type) {
      return {
        stage: "#713b8c",
        toilets: "#297c82",
        ladyToilets: "#9a4f78",
        pint: "#a65d16",
        waterPoints: "#2477a8",
        foodDrink: "#c85d3d",
        firstAid: "#b83f3f",
        entrance: "#397544",
        showers: "#4285a4",
        accessible: "#286c9f",
        information: "#5261a5",
        reception: "#5261a5",
        shop: "#8a5b35",
        activitySpaces: "#8b5b9f",
        fireSafety: "#c64b2f",
        ticket: "#9a6b18",
        photo: "#65518f",
        wasteDisposal: "#56675a",
        washingUp: "#4b7d71",
        phoneCharging: "#697331",
        accommodation: "#567044",
        charity: "#a34866",
      }[type] || "#4f6652";
    }

    function addPoiMarkers(map, pois, categories) {
      for (const poi of pois) {
        const category = categories[poi.category];
        const type = category?.type || poi.type || "location";
        const icon = category?.icon || type;
        const marker = document.createElement("button");
        marker.type = "button";
        marker.className = `map-marker${type === "stage" ? " stage" : ""}`;
        marker.style.setProperty("--marker-color", markerColor(icon));
        marker.setAttribute("aria-label", `${poi.name}, ${category?.name || "location"}`);
        marker.title = poi.name;
        marker.innerHTML = markerIcon(icon);
        if (type === "stage") {
          const label = document.createElement("span");
          label.className = "marker-label";
          label.textContent = poi.name;
          marker.append(label);
        }

        const content = document.createElement("div");
        const name = document.createElement("strong");
        const categoryName = document.createElement("span");
        name.textContent = poi.name;
        categoryName.textContent = category?.name || poi.type || "Location";
        content.append(name, categoryName);
        const popup = new maplibregl.Popup({ offset: type === "stage" ? 22 : 16 })
          .setDOMContent(content);
        new maplibregl.Marker({ element: marker })
          .setLngLat(poi.gps.coordinates)
          .setPopup(popup)
          .addTo(map);
      }
    }

    function initMap(data) {
      if (festivalMap) {
        festivalMap.resize();
        return;
      }

      const app = data.config?.app || {};
      const bounds = app.mapBounds;
      const mapImage = app.images?.mapImage;
      if (!bounds || !mapImage) return;

      const categories = Object.fromEntries(data.categories.map((category) => [category.id, category]));
      const pois = data.poi.filter((poi) =>
        Array.isArray(poi.gps?.coordinates) && poi.gps.coordinates.length === 2
      );
      const corners = [
        [bounds.northWest.longitude, bounds.northWest.latitude],
        [bounds.northEast.longitude, bounds.northEast.latitude],
        [bounds.southEast.longitude, bounds.southEast.latitude],
        [bounds.southWest.longitude, bounds.southWest.latitude],
      ];

      festivalMap = new maplibregl.Map({
        container: "map",
        style: {
          version: 8,
          sources: {
            "festival-map": {
              type: "image",
              url: imgPath(mapImage),
              coordinates: corners,
            },
          },
          layers: [
            {
              id: "background",
              type: "background",
              paint: { "background-color": "#dce5d3" },
            },
            { id: "festival-map", type: "raster", source: "festival-map" },
          ],
        },
        bounds: [
          [bounds.southWest.longitude, bounds.southWest.latitude],
          [bounds.northEast.longitude, bounds.northEast.latitude],
        ],
        fitBoundsOptions: { padding: 24 },
        minZoom: 12,
        maxZoom: 19,
        attributionControl: false,
      });

      festivalMap.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");
      addPoiMarkers(festivalMap, pois, categories);
      $("mapCount").textContent = `${pois.length} mapped locations`;
    }

    function matches(ev, state) {
      if (ev.session.timeMarker !== state.day) return false;
      if (state.view === "planned" && !state.favorites.has(ev.session.id)) return false;
      if (state.venue && ev.venue?.id !== state.venue) return false;
      if (state.category && !(ev.session.category || []).includes(state.category)) return false;
      if (!state.query) return true;
      const q = state.query.toLowerCase();
      const hay = [
        ev.entity?.name,
        ev.venue?.name,
        ev.entity?.description,
        ...ev.cats.map((c) => c.name),
        ...ev.subs.map((c) => c.name),
      ].join(" ").toLowerCase();
      return hay.includes(q);
    }

    function render() {
      const data = state.data;
      const app = data.config?.app || {};
      const tz = app.tz || "Europe/London";
      const indexes = buildIndexes(data);
      const fallback = app.images?.defaultImage;
      const events = data.entitySessions
        .map((s) => eventRecord(s, indexes))
        .filter((ev) => ev.entity && ev.venue);

      $("viewToggle").innerHTML = `
        <button data-view="all" class="${state.view === "all" ? "active" : ""}" aria-pressed="${state.view === "all"}">Everything</button>
        <button data-view="planned" class="${state.view === "planned" ? "active" : ""}" aria-pressed="${state.view === "planned"}">
          My Festival (${state.favorites.size})
        </button>
        <button data-view="map" class="${state.view === "map" ? "active" : ""}" aria-pressed="${state.view === "map"}">Map</button>
      `;

      const mapMode = state.view === "map";
      $("days").hidden = mapMode;
      $("tools").hidden = mapMode;
      $("cats").hidden = mapMode;
      $("mapView").hidden = !mapMode;
      $("status").hidden = mapMode;
      $("list").hidden = mapMode;
      if (mapMode) {
        openDrawer(null, tz, fallback, events);
        requestAnimationFrame(() => initMap(data));
        return;
      }

      const days = dayKeys(data);
      $("days").innerHTML = days.map((key) => {
        const label = fmtDay(key, tz);
        const count = events.filter((ev) =>
          ev.session.timeMarker === key && (state.view === "all" || state.favorites.has(ev.session.id))
        ).length;
        return `<button data-day="${key}" class="${key === state.day ? "active" : ""}">
          ${label.weekday}<span class="sub">${label.short} · ${count}</span>
        </button>`;
      }).join("");

      const entityCats = data.categories
        .filter((c) => c.belongsTo === "entity")
        .sort((a, b) => b.tier - a.tier);
      $("cats").innerHTML = `<button class="chip ${state.category === "" ? "active" : ""}" data-cat="">All</button>` +
        entityCats.map((c) =>
          `<button class="chip ${state.category === c.id ? "active" : ""}" data-cat="${c.id}">${c.name}</button>`
        ).join("");

      const venues = [...new Map(events.map((ev) => [ev.venue.id, ev.venue])).values()]
        .sort((a, b) => a.name.localeCompare(b.name));
      $("venue").innerHTML = `<option value="">All venues</option>` +
        venues.map((v) => `<option value="${v.id}" ${v.id === state.venue ? "selected" : ""}>${v.name}</option>`).join("");

      const shown = events
        .filter((ev) => matches(ev, state))
        .sort((a, b) => a.session.start.localeCompare(b.session.start) || a.venue.name.localeCompare(b.venue.name));

      const groups = new Map();
      for (const ev of shown) {
        if (!groups.has(ev.venue.id)) groups.set(ev.venue.id, { venue: ev.venue, items: [] });
        groups.get(ev.venue.id).items.push(ev);
      }

      $("status").textContent = `${shown.length} set${shown.length === 1 ? "" : "s"} · days start at ${app.dayStartHour ?? 5}:00 ${tz.replace("_", " ")}`;
      $("list").innerHTML = [...groups.values()].map((group) => `
        <section class="venue">
          <h2>${group.venue.name}</h2>
          ${group.items.map((ev) => `
            <div class="row">
              <button class="row-main" data-id="${ev.session.id}" aria-label="View ${ev.entity.name}">
                <div class="when">${fmtRange(ev.session.start, ev.session.end, tz)}</div>
                <img src="${imgPath(ev.entity.image, fallback)}" alt="">
                <div>
                  <div class="name">${ev.entity.name}</div>
                  <div class="meta">${ev.cats.map((c) => c.name).join(" · ")}${ev.subs.length ? " · " + ev.subs.map((s) => s.name).join(", ") : ""}</div>
                </div>
              </button>
              ${starButton(ev)}
            </div>
          `).join("")}
        </section>
      `).join("") || `<p class="status">${
        state.view === "planned" && state.favorites.size === 0
          ? "Your festival is empty. Switch to Everything and star some sets to start planning."
          : state.view === "planned"
            ? "Nothing in your festival matches this day and these filters."
            : "Nothing matches these filters."
      }</p>`;

      openDrawer(events.find((ev) => ev.session.id === state.selected), tz, fallback, events);
    }

    function openDrawer(ev, tz, fallback, allEvents) {
      const drawer = $("drawer");
      const bg = $("drawerBg");
      if (!ev) {
        drawer.classList.remove("open");
        bg.classList.remove("open");
        return;
      }
      const others = allEvents
        .filter((item) => item.entity.id === ev.entity.id && item.session.id !== ev.session.id)
        .sort((a, b) => a.session.start.localeCompare(b.session.start));
      const warnings = [
        ev.session.epilepsyWarning ? "Epilepsy warning" : "",
        ev.session.explicitWarning ? "Explicit" : "",
        ev.session.isSpicy ? "Spicy" : "",
        ev.session.accessibilityInfo || ev.entity.accessibilityInfo || "",
      ].filter(Boolean);
      const links = (ev.entity.externalLinks || []).filter((l) => l?.url);

      drawer.innerHTML = `
        <button class="close icon-btn" id="closeDrawer" aria-label="Close">×</button>
        <img class="hero" src="${imgPath(ev.entity.image, fallback)}" alt="">
        <div class="body">
          <div class="title-row">
            <h2>${ev.entity.name}</h2>
            ${starButton(ev)}
          </div>
          <div class="when">${ev.venue.name}<br>${fmtDay(ev.session.timeMarker, tz).weekday} ${fmtRange(ev.session.start, ev.session.end, tz)}</div>
          ${warnings.map((w) => `<span class="warn">${w}</span>`).join("")}
          <p class="desc">${ev.session.description || ev.entity.description || ""}</p>
          ${links.length ? `<p>${links.map((l) => `<a href="${l.url}" target="_blank" rel="noreferrer">${l.text || l.type || l.url}</a>`).join(" · ")}</p>` : ""}
          ${others.length ? `<div class="also"><strong>Other times</strong>${others.map((item) =>
            `<button data-id="${item.session.id}">${item.venue.name} · ${fmtDay(item.session.timeMarker, tz).weekday} ${fmtRange(item.session.start, item.session.end, tz)}</button>`
          ).join("")}</div>` : ""}
        </div>
      `;
      drawer.classList.add("open");
      bg.classList.add("open");
    }

    function bind() {
      $("viewToggle").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-view]");
        if (!btn) return;
        state.view = btn.dataset.view;
        if (state.view === "map") state.selected = null;
        render();
      });
      $("days").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-day]");
        if (!btn) return;
        state.day = btn.dataset.day;
        render();
      });
      $("cats").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-cat]");
        if (!btn) return;
        state.category = btn.dataset.cat;
        render();
      });
      $("venue").addEventListener("change", (e) => {
        state.venue = e.target.value;
        render();
      });
      $("search").addEventListener("input", (e) => {
        state.query = e.target.value.trim();
        render();
      });
      $("list").addEventListener("click", (e) => {
        const favorite = e.target.closest("button[data-favorite]");
        if (favorite) {
          toggleFavorite(favorite.dataset.favorite);
          return;
        }
        const btn = e.target.closest("button[data-id]");
        if (!btn) return;
        state.selected = btn.dataset.id;
        render();
      });
      $("drawer").addEventListener("click", (e) => {
        const favorite = e.target.closest("button[data-favorite]");
        if (favorite) {
          toggleFavorite(favorite.dataset.favorite);
          return;
        }
        if (e.target.id === "closeDrawer") {
          state.selected = null;
          render();
          return;
        }
        const btn = e.target.closest("button[data-id]");
        if (!btn) return;
        state.selected = btn.dataset.id;
        render();
      });
      $("drawerBg").addEventListener("click", () => {
        state.selected = null;
        render();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          state.selected = null;
          render();
        }
      });
    }

    async function init() {
      try {
        const res = await fetch(DATA_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        state.data = data;
        state.favorites = loadFavorites();
        const validSessionIds = new Set(data.entitySessions.map((session) => session.id));
        state.favorites = new Set([...state.favorites].filter((id) => validSessionIds.has(id)));
        saveFavorites();
        const app = data.config?.app || {};
        $("title").textContent = `${app.name || "Shambala"} timetable`;
        $("subtitle").textContent = `Local viewer · delta ${data.source?.deltaVersion || "bundled"}`;
        const logo = imgPath(app.images?.logo);
        if (logo) {
          $("logo").src = logo;
          $("logo").hidden = false;
        }
        state.day = dayKeys(data)[0];
        $("controls").hidden = false;
        bind();
        render();
      } catch (err) {
        $("subtitle").textContent = "Could not load data/merged.json";
        $("status").innerHTML = `<div class="error">
          This page needs to be served over HTTP so it can read the JSON.<br>
          From the project folder run:<br>
          <code>python3 -m http.server 8000</code><br>
          then open <code>http://localhost:8000/timetable.html</code><br>
          <small>${err.message}</small>
        </div>`;
      }
    }

    init();
  </script>
</body>
</html>
